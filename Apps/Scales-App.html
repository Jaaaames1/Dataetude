<title>Piano Scales Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0c0b12;--sb-bg:#0f0e18;--main-bg:#0c0b12;
  --bkey:linear-gradient(180deg,#2a2a2a 0%,#111 100%);
  --active-bg:var(--active-bg);--active-color:var(--active-color);--active-border:var(--active-border);
  --text:#ddd;--sub:#777;--faint:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.07);
  --wkey:linear-gradient(180deg,#f5f5f5 0%,#e0e0e0 100%);
  --wborder:#aaa;--note-num:#3a3a3a;--kb-bg:#18181f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:Georgia,serif;min-height:100vh;transition:background .25s,color .25s;}
button{outline:none;border:none;font-family:inherit;cursor:pointer;}
button:active{opacity:.82;transform:scale(.97);}
input{font-family:inherit;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}

#shell{display:flex;flex-direction:column;}
#sidebar{background:var(--sb-bg);border-bottom:1px solid var(--border);flex-shrink:0;}
#main{flex:1;background:var(--main-bg);display:flex;flex-direction:column;min-height:0;}

.chord-list-body{overflow-y:auto;overflow-x:hidden;padding:10px 14px 24px;
  overscroll-behavior:contain;}

/* PORTRAIT: shell locked to viewport — sidebar (header+tab bar) frozen, main scrolls.
   Chords tab overrides main to non-scroll via portrait-chords class (unchanged). */
@media(orientation:portrait){
  html,body{height:100%;overflow:hidden;}
  #shell{height:100dvh;overflow:hidden;}
  #sidebar{flex-shrink:0;}
  #main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
  /* Chords tab: main goes non-scroll, chord-list-body handles scrolling */
  #shell.portrait-chords #main{overflow:hidden;min-height:0;}
  #shell.portrait-chords .chord-list-body{
    flex:1;min-height:0;max-height:none;
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  #shell.portrait-chords .portrait-grid{display:none;}
  .tab-bar-landscape{display:none !important;}
}

#main.metro-tab .portrait-grid{display:none;}
#main.editor-tab .portrait-grid{display:none;}

.portrait-grid{display:block;}
.landscape-grid{display:none;}

@media(orientation:landscape){
  html,body{height:100%;overflow:hidden;}
  #shell{flex-direction:row;height:100vh;overflow:hidden;
    padding-left:calc(0px + env(safe-area-inset-left));
    padding-right:calc(8px + env(safe-area-inset-right));}
  #sidebar{width:240px;min-width:240px;overflow-y:auto;overflow-x:hidden;
    border-bottom:none;border-right:1px solid var(--border);}
  #main{overflow-y:auto;overflow-x:hidden;}
  .portrait-grid{display:none;}
  .landscape-grid{display:block;}
  #main.editor-tab .landscape-grid{display:none;}
  .chord-list-body{flex:1;max-height:none;}
  .tab-bar-portrait{display:none !important;}
}

.pill{padding:6px 11px;border-radius:14px;font-family:'Josefin Sans',sans-serif;
  font-size:0.67rem;letter-spacing:0.04em;cursor:pointer;}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;}
.wkey,.bkey{transition:background .12s,box-shadow .12s,border-color .12s;}

/* Fingering editor */
.fe-hl{font-size:0.58rem;color:#666;font-family:'Josefin Sans',sans-serif;
  letter-spacing:0.12em;margin:10px 0 6px;text-transform:uppercase;}
.fe-inputs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;}
.fe-inp{width:30px;height:30px;text-align:center;border-radius:6px;
  background:var(--faint);border:1px solid rgba(255,255,255,0.14);
  color:var(--text);font-size:0.85rem;-moz-appearance:textfield;}
.fe-rst{padding:5px 12px;border-radius:12px;background:rgba(200,80,80,.1);
  border:1px solid rgba(200,80,80,.3);color:#d88;font-size:0.6rem;
  font-family:'Josefin Sans',sans-serif;letter-spacing:0.06em;margin-top:6px;}

/* Settings */
.sett-section{background:var(--faint);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;}
.sett-label{font-size:0.6rem;color:var(--sub);font-family:'Josefin Sans',sans-serif;
  letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px;}
.tog-wrap{position:relative;width:44px;height:24px;cursor:pointer;flex-shrink:0;}
.tog-wrap input{opacity:0;width:0;height:0;position:absolute;}
.tog-slider{position:absolute;inset:0;border-radius:12px;background:#333;transition:background .2s;}
.tog-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;
  border-radius:50%;background:#fff;transition:transform .2s;}
.tog-wrap input:checked+.tog-slider{background:#5572d4;}
.tog-wrap input:checked+.tog-slider::before{transform:translateX(20px);}
.pal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.pal-btn{border-radius:8px;padding:6px 4px;border:2px solid transparent;
  font-family:'Josefin Sans',sans-serif;font-size:0.55rem;letter-spacing:0.04em;
  cursor:pointer;text-align:center;background:var(--faint);color:var(--text);transition:border-color .15s;}
.pal-btn.active{border-color:rgba(255,255,255,0.5);}
.pal-swatch{display:flex;height:10px;border-radius:3px;overflow:hidden;margin-bottom:4px;}
.pal-swatch span{flex:1;}

/* Transport controls */
.transport{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;
  background:var(--faint);border:1px solid var(--border);border-radius:14px;
  padding:6px 8px;margin:8px 14px;overflow:hidden;}
.tr-btn{width:34px;height:34px;border-radius:10px;background:transparent;
  border:none;color:rgba(160,180,200,0.7);font-size:1rem;display:flex;align-items:center;
  justify-content:center;transition:background .15s,color .15s;cursor:pointer;flex-shrink:0;}
.tr-btn:hover{background:rgba(255,255,255,0.06);color:rgba(200,220,240,0.9);}
.tr-btn.active{color:var(--active-color);background:var(--active-bg);}
.tr-btn.loop-active{color:#e8c060;background:rgba(232,192,96,0.18);border-radius:10px;}
.tr-sep{width:1px;height:18px;background:var(--border);margin:0 3px;flex-shrink:0;}
.bpm-wrap{display:flex;align-items:center;gap:4px;}
.bpm-wrap input[type=range]{width:60px;accent-color:#7ec8a0;cursor:pointer;}
.bpm-val{font-family:'Josefin Sans',sans-serif;font-size:0.58rem;color:var(--sub);
  min-width:46px;text-align:right;}

/* Hand mode selector */
.hand-btn{padding:4px 8px;border-radius:8px;background:transparent;
  border:1px solid var(--border);color:var(--sub);
  font-family:'Josefin Sans',sans-serif;font-size:0.55rem;letter-spacing:0.04em;
  cursor:pointer;transition:background .15s,color .15s,border-color .15s;flex-shrink:0;}
.hand-btn.active{background:var(--active-bg);color:var(--active-color);
  border-color:rgba(160,200,180,0.35);}

/* Keyboard sync toggle */
.kb-sync-btn{padding:3px 10px;border-radius:8px;background:transparent;
  border:1px solid var(--border);color:var(--sub);
  font-family:'Josefin Sans',sans-serif;font-size:0.52rem;letter-spacing:0.05em;
  cursor:pointer;transition:background .15s,color .15s,border-color .15s;float:right;margin-top:-2px;}
.kb-sync-btn.active{background:var(--active-bg);color:var(--active-color);
  border-color:rgba(160,200,180,0.35);}
/* On metro tab: hide whichever tab bar is in the non-active pane to avoid duplicate */
#shell.portrait-chords-not-used{} /* placeholder */
/* In portrait, landscape tab bar must always be hidden regardless of tab */
@media(orientation:portrait){
  .tab-bar-landscape{display:none !important;}
}
/* In landscape, portrait tab bar must always be hidden regardless of tab */
@media(orientation:landscape){
  .tab-bar-portrait{display:none !important;}
}
#main.metro-tab .portrait-grid{display:none;}
#main.editor-tab .portrait-grid{display:none;}
#main.pads-tab .portrait-grid{display:none !important;}
#main.pads-tab #sb-scale-content{display:none !important;}
.metro-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 20px 24px;gap:28px;}.metro-pulse{width:90px;height:90px;border-radius:50%;background:var(--faint);
  border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:2rem;transition:background .06s,box-shadow .06s;flex-shrink:0;}
.metro-pulse.beat1{background:rgba(160,200,180,0.22);box-shadow:0 0 22px rgba(160,200,180,0.45);border-color:rgba(160,200,180,0.5);}
.metro-pulse.beat{background:rgba(160,200,180,0.10);box-shadow:0 0 10px var(--active-bg);border-color:rgba(160,200,180,0.25);}
.metro-dots{display:flex;gap:10px;align-items:center;height:18px;}
.metro-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background .06s,transform .06s;}
.metro-dot.beat1{background:var(--active-color);transform:scale(1.4);}
.metro-dot.beat{background:rgba(160,200,180,0.55);transform:scale(1.15);}
.metro-bpm-row{display:flex;align-items:center;gap:10px;width:100%;max-width:320px;}
.metro-bpm-val{font-family:'Josefin Sans',sans-serif;font-size:1.6rem;font-weight:700;
  color:var(--text);min-width:58px;text-align:center;}
@media(orientation:landscape){
  .metro-bpm-val{font-size:1.1rem;min-width:44px;}
}
.metro-bpm-lbl{font-family:'Josefin Sans',sans-serif;font-size:0.52rem;color:var(--sub);
  letter-spacing:0.14em;text-transform:uppercase;}
.metro-bpm-row input[type=range]{flex:1;accent-color:rgba(160,200,180,0.8);}
.metro-sig{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.metro-sig-btn{padding:6px 14px;border-radius:10px;font-family:'Josefin Sans',sans-serif;
  font-size:0.7rem;font-weight:700;border:1px solid var(--border);background:var(--faint);
  color:var(--sub);cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.metro-sig-btn.active{background:var(--active-bg);color:var(--active-color);
  border-color:rgba(160,200,180,0.4);}
.metro-play-btn{width:64px;height:64px;border-radius:50%;border:2px solid rgba(160,200,180,0.4);
  background:var(--active-bg);color:rgba(160,200,180,0.9);font-size:1.4rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,box-shadow .15s;}
.metro-play-btn.active{background:var(--active-bg);box-shadow:0 0 18px rgba(160,200,180,0.3);}
.metro-tap-btn{padding:14px 28px;border-radius:14px;border:1px solid var(--border);
  background:var(--faint);color:var(--sub);font-family:'Josefin Sans',sans-serif;
  font-size:0.75rem;letter-spacing:0.08em;cursor:pointer;min-width:130px;text-align:center;}
.metro-nudge-row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.metro-nudge-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);user-select:none;-webkit-user-select:none;
  background:var(--faint);color:var(--sub);font-family:'Josefin Sans',sans-serif;
  font-size:0.65rem;letter-spacing:0.04em;cursor:pointer;transition:background .12s,color .12s;}
.metro-nudge-btn:active{background:rgba(255,255,255,0.12);color:var(--text);}
.metro-sound-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.metro-sound-btn{padding:6px 12px;border-radius:10px;font-family:'Josefin Sans',sans-serif;
  font-size:0.65rem;font-weight:600;border:1px solid var(--border);background:var(--faint);
  color:var(--sub);cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.metro-sound-btn.active{background:var(--active-bg);color:var(--active-color);
  border-color:rgba(160,200,180,0.4);}
.metro-noaccent-btn{padding:6px 16px;border-radius:10px;font-family:'Josefin Sans',sans-serif;
  font-size:0.65rem;font-weight:600;border:1px solid var(--border);background:var(--faint);
  color:var(--sub);cursor:pointer;margin-top:6px;transition:background .15s,color .15s,border-color .15s;}
.metro-noaccent-btn.active{background:rgba(200,160,120,0.15);color:rgba(220,180,120,0.95);
  border-color:rgba(200,160,120,0.4);}
.metro-bpm-input{font-family:'Josefin Sans',sans-serif;font-size:1.6rem;font-weight:700;
  color:var(--text);background:transparent;border:none;outline:none;
  width:90px;text-align:center;cursor:text;}
@media(orientation:landscape){
  .metro-bpm-input{font-size:1.1rem;width:70px;}
}

/* Settings cog button */
.cog-btn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;
  width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);
  border:1px solid var(--border);color:var(--sub);font-size:1rem;
  display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer;}
.cog-btn:hover{background:rgba(255,255,255,0.1);color:var(--text);}
.cog-btn.active{background:rgba(255,255,255,0.12);color:var(--text);}
/* Wake lock / screen stay-on button — sits left of cog */
.wake-btn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:48px;
  width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);
  border:1px solid var(--border);color:var(--sub);font-size:0.85rem;
  display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer;}
.wake-btn:hover{background:rgba(255,255,255,0.1);color:var(--text);}
.wake-btn.active{background:rgba(232,192,96,0.35);color:#f0d060;border-color:rgba(232,192,96,0.7);
  box-shadow:0 0 8px rgba(232,192,96,0.4);}
/* Wave/Tone button — sits between wake and cog */
.wave-btn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:88px;
  width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);
  border:1px solid var(--border);color:var(--sub);font-size:1rem;
  display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer;}
.wave-btn:hover{background:rgba(255,255,255,0.1);color:var(--text);}
.wave-btn.active{background:var(--active-bg);color:var(--active-color);
  border-color:rgba(160,200,180,0.4);}
/* Tone panel — same slide-in as settings */
#tonePanel{position:fixed;inset:0;z-index:200;display:flex;justify-content:flex-end;
  pointer-events:none;transition:background .25s;}
#tonePanel.open{pointer-events:all;background:rgba(0,0,0,0.5);}
.tone-sheet{background:var(--sb-bg);border-left:1px solid var(--border);
  width:min(320px,90vw);height:100%;overflow-y:auto;padding:0;
  box-shadow:-4px 0 24px rgba(0,0,0,0.5);
  transform:translateX(100%);transition:transform .25s;}
#tonePanel.open .tone-sheet{transform:translateX(0);}
.tone-sheet-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--border);}
.tone-sheet-title{font-family:'Josefin Sans',sans-serif;font-size:0.8rem;font-weight:700;
  letter-spacing:0.1em;color:var(--text);}
/* Chord pad page */
.cpad-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.cpad-controls{flex-shrink:0;display:flex;flex-direction:column;gap:4px;
  padding:5px 10px;background:var(--sb-bg);border-bottom:1px solid var(--border);}
.cpad-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
.cpad-label{font-family:'Josefin Sans',sans-serif;font-size:0.52rem;letter-spacing:0.1em;
  color:var(--sub);text-transform:uppercase;white-space:nowrap;}
.cpad-scale-btn{font-family:'Josefin Sans',sans-serif;font-size:0.62rem;font-weight:700;
  color:var(--text);background:rgba(255,255,255,0.06);border:1px solid var(--border);
  border-radius:8px;padding:3px 10px;cursor:pointer;letter-spacing:0.02em;}
.cpad-scale-btn:active{background:rgba(255,255,255,0.12);}
.cpad-drum-btn{padding:5px 6px;border-radius:8px;font-family:'Josefin Sans',sans-serif;
  font-size:0.54rem;font-weight:600;border:1px solid var(--border);background:var(--faint);
  color:var(--sub);cursor:pointer;transition:background .12s,color .12s,border-color .12s;white-space:nowrap;}
.cpad-drum-btn.active{background:var(--active-bg);color:var(--active-color);
  border-color:rgba(160,200,180,0.4);}
.cpad-drum-btn.queued{background:rgba(200,180,80,0.18);color:rgba(220,200,80,0.95);border-color:rgba(200,180,80,0.4);}

.cpad-pad{border-radius:14px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;user-select:none;touch-action:none;
  border:none;gap:3px;transition:filter .06s;}
.cpad-pad.pressed{filter:brightness(0.72);}
.cpad-pad.move-selected{outline:3px solid #fff;outline-offset:-3px;
  animation:padpulse 0.7s ease-in-out infinite alternate;}
@keyframes padpulse{from{outline-color:rgba(255,255,255,0.9);}to{outline-color:rgba(255,255,255,0.3);}}
.cpad-pad-numeral{font-family:'Josefin Sans',sans-serif;font-size:1rem;font-weight:700;
  color:rgba(255,255,255,0.9);text-shadow:0 1px 3px rgba(0,0,0,0.4);}
.cpad-pad-name{font-family:'Josefin Sans',sans-serif;font-size:0.65rem;font-weight:600;
  color:rgba(255,255,255,0.75);text-shadow:0 1px 2px rgba(0,0,0,0.4);}
/* Portrait 3-3-2 grid */
.cpad-grid{display:grid;flex:1;min-height:0;gap:6px;padding:8px;grid-template-columns:repeat(3,1fr);}
/* Melody mode chord pattern popup */
.ml-prog-popup{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.6);
  display:flex;align-items:center;justify-content:center;}
.ml-prog-box{background:var(--sb-bg);border-radius:16px;padding:14px;
  border:1px solid var(--border);width:min(340px,92vw);max-height:75vh;overflow-y:auto;}
.ml-prog-title{font-family:'Josefin Sans',sans-serif;font-size:0.7rem;font-weight:700;
  letter-spacing:0.1em;color:var(--sub);text-transform:uppercase;margin-bottom:8px;text-align:center;}
.ml-prog-item{width:100%;text-align:left;padding:9px 12px;border-radius:10px;
  font-family:'Josefin Sans',sans-serif;font-size:0.62rem;border:1px solid var(--border);
  background:var(--faint);color:var(--text);cursor:pointer;margin-bottom:5px;
  transition:background .12s,border-color .12s;}
.ml-prog-item:active,.ml-prog-item.active{background:rgba(100,160,220,0.18);
  color:#90c8f8;border-color:rgba(100,160,220,0.45);}
.ml-prog-section{font-family:'Josefin Sans',sans-serif;font-size:0.5rem;letter-spacing:0.14em;

// Black keys (C#,D#,F#,G#,A#) always finger 3, both hands.
// White keys: finger 1 except:
//   RH: F and C get finger 2 (arrived from E or B across the no-black-key gap)
//   LH: E and B get finger 2
(function(){
  var BLACK=[1,3,6,8,10];
  TONICS.forEach(function(t){
    var s=t.semitone;
    var rh=[],lh=[];
    for(var pos=0;pos<25;pos++){
      var pc=(s+pos)%12;
      if(BLACK.indexOf(pc)>=0){rh.push(3);lh.push(3);}
      else{
        var prevPc=pos>0?(s+pos-1)%12:-1;
        var rf=1;
        if(pc===5&&prevPc===4)rf=2;
        if(pc===0&&prevPc===11)rf=2;
        rh.push(rf);
        var lf=1;
        if(pc===4||pc===11)lf=2;
        lh.push(lf);
      }
    }
    var rhDn=rh.slice().reverse();if(rhDn[0]===rh[rh.length-1])rhDn=rhDn.slice(1);
    var lhDn=lh.slice().reverse();if(lhDn[0]===lh[lh.length-1])lhDn=lhDn.slice(1);
    DEF[t.label+' Chromatic']={rh:rh.concat(rhDn),lh:lh.concat(lhDn)};
  });
})();

// ── FINGERING HELPERS ─────────────────────────────────────────────────────────
function fkey(tl,st,dir){
  if(st==='Chromatic') return tl+' Chromatic';
  if(st==='Major Pentatonic') return tl+' Major Pentatonic';
  if(st==='Minor Pentatonic') return tl+' Minor Pentatonic';
  var m=FP[tl]; if(!m)return null;
  var p=m[STC[st]]; if(!p)return null;
  if(st==='Major Arpeggio') return p+' Major Arpeggio (2 oct.)';
  if(st==='Minor Arpeggio') return p+' Minor Arpeggio (2 oct.)';
  if(st==='Melodic Minor'){
    if(dir==='DESC'){var pn=m[STC['Natural Minor']];return pn+' Natural Minor';}
    return p+' Melodic Minor (Asc)';
  }
  return p+' '+st;
}
function gf(tl,st,dir){var k=fkey(tl,st,dir);return FING[k]||null;}
function mOf(pc,oc){return(oc+1)*12+pc;}
function pcOf(m){return m%12;}
function ocOf(m){return Math.floor(m/12)-1;}
function isW(m){return[0,2,4,5,7,9,11].indexOf(pcOf(m))>=0;}

function midis(sem,st,dir,rs,re){
  var key=st;
  if(st==='Melodic Minor')key=dir==='ASC'?'Melodic Minor Asc':'Melodic Minor Desc';
  var iv=IV[key]||IV['Major'];
  var isPent=st==='Major Pentatonic'||st==='Minor Pentatonic';
  var loops=isPent?1:2;
  var span=iv.reduce(function(a,b){return a+b;},0)*loops;
  var so=2;
  for(var o=0;o<=8;o++){var s=mOf(sem,o);if(s>=rs&&s+span<=re){so=o;break;}}
  var m=mOf(sem,so),res=[m];
  for(var r=0;r<loops;r++)for(var i=0;i<iv.length;i++){m+=iv[i];res.push(m);}
  return res;
}
function relScale(sem,st){
  if(st==='Major'||st==='Major Arpeggio'){
    var r=TONICS.find(function(x){return x.semitone===(sem+9)%12;});
    return r?r.label.split('/')[0]+' Natural Minor':'';
  }
  if(st==='Major Pentatonic'){
    var r=TONICS.find(function(x){return x.semitone===(sem+9)%12;});
    return r?r.label.split('/')[0]+' Minor Pentatonic':'';
  }
  if(st==='Minor Pentatonic'){
    var r2=TONICS.find(function(x){return x.semitone===(sem+3)%12;});
    return r2?r2.label.split('/')[0]+' Major Pentatonic':'';
  }
  if(st.indexOf('Minor')>=0){
    var r2=TONICS.find(function(x){return x.semitone===(sem+3)%12;});
    return r2?r2.label.split('/')[0]+' Major':'';
  }
  return '';
}
function parScale(tl,st){
  var b=tl.split('/')[0];
  if(st==='Major Pentatonic') return b+' Minor Pentatonic';
  if(st==='Minor Pentatonic') return b+' Major Pentatonic';
  return(st==='Major'||st==='Major Arpeggio')?b+' Natural Minor':b+' Major';
}

// ── AUDIO ENGINE ──────────────────────────────────────────────────────────────
var AC=null;
// SYNTH parameters — defaults exactly match the original hand-tuned sound.
// Changing these is non-destructive; Restore Defaults resets to these values.
var SYNTH_DEFAULTS={
  wave:0.0,
  detune:0.0,
  modulation:0.0,
  vibratoRate:5.5,
  attack:0.006,
  decay:1.4,
  sustain:0.08,
  filterQ:0.15,
  noiseMix:0.0,
  stereoWidth:0.5
};
var SYNTH=Object.assign({_preset:'Piano'},SYNTH_DEFAULTS);

function getAC(){
  if(!AC){
    AC=new(window.AudioContext||window.webkitAudioContext)();
    _buildAudioChain();
  }
  return AC;
}

// Shared audio chain: masterGain → reverb (wet) + dry → destination
var _masterGain=null,_reverbGain=null,_dryGain=null,_convolver=null,_mlChordGain=null;
function _buildAudioChain(){
  if(!AC)return;
  _masterGain=AC.createGain();_masterGain.gain.value=1.0;
  // Reverb: synthesised impulse response (2s decay)
  _convolver=AC.createConvolver();
  var rate=AC.sampleRate,len=rate*2;
  var buf=AC.createBuffer(2,len,rate);
  for(var ch=0;ch<2;ch++){var d=buf.getChannelData(ch);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);}
  _convolver.buffer=buf;
  _reverbGain=AC.createGain();_reverbGain.gain.value=0; // 0=no reverb by default
  _dryGain=AC.createGain();_dryGain.gain.value=1.0;
  _masterGain.connect(_dryGain);_dryGain.connect(AC.destination);
  _masterGain.connect(_convolver);_convolver.connect(_reverbGain);_reverbGain.connect(AC.destination);
  // Dedicated gain for chord loop notes — can be cut instantly without affecting drums
  _mlChordGain=AC.createGain();_mlChordGain.gain.value=1.0;
  _mlChordGain.connect(_masterGain);
}
function _applyReverbLevel(v){
  // modulation slider (0–1) drives reverb wet/dry: 0=none, 1=heavy
  if(_reverbGain)_reverbGain.gain.setTargetAtTime(v*0.6,AC.currentTime,0.05);
  if(_dryGain)_dryGain.gain.setTargetAtTime(1-v*0.3,AC.currentTime,0.05);
}

function playNote(midi,when,dur,vol,destOverride){
  var ac=getAC();
  var freq=440*Math.pow(2,(midi-69)/12);
  var attackTime=Math.max(0.005,SYNTH.attack);
  var noteDur=dur*SYNTH.decay;
  var dest=destOverride||_masterGain||ac.destination;
  var w=SYNTH.wave;
  var v=vol||0.4;

  // Wave blend: 0=triangle, 0.5=square, 1=sawtooth
  // Triangle is perceptually quiet so boost it
  var triAmt,sqAmt,sawAmt,volComp;
  if(w<=0.5){triAmt=1-w*2;sqAmt=w*2;sawAmt=0;volComp=1.6-w*1.2;}
  else{triAmt=0;sqAmt=2-w*2;sawAmt=(w-0.5)*2;volComp=1.0;}
  var vf=v*volComp;

  var cutoff=2400+w*3600;
  var filt=ac.createBiquadFilter();
  filt.type='lowpass';filt.frequency.value=cutoff+SYNTH.filterQ*400;
  filt.Q.value=SYNTH.filterQ*5;

  if(SYNTH.stereoWidth>0.001&&ac.createStereoPanner){
    var panner=ac.createStereoPanner();
    panner.pan.value=Math.max(-1,Math.min(1,((midi-66)/30)*SYNTH.stereoWidth));
    filt.connect(panner);panner.connect(dest);
  } else {filt.connect(dest);}

  var lfoNode=null;
  if(SYNTH.modulation>0.001){
    lfoNode=ac.createOscillator();var lfoG=ac.createGain();
    lfoNode.type='sine';lfoNode.frequency.value=Math.max(0.5,SYNTH.vibratoRate);
    lfoG.gain.value=freq*(Math.pow(2,SYNTH.modulation*12/1200)-1);
    lfoNode.connect(lfoG);lfoNode.start(when);lfoNode.stop(when+noteDur+0.1);
  }

  function makeOsc(type,amount){
    if(amount<0.01)return;
    var osc=ac.createOscillator(),g=ac.createGain();
    osc.type=type;osc.frequency.value=freq;
    if(lfoNode){var lg=ac.createGain();lg.gain.value=1;lfoNode.connect(lg);lg.connect(osc.frequency);}
    g.gain.setValueAtTime(0,when);
    g.gain.linearRampToValueAtTime(vf*amount,when+attackTime);
    g.gain.exponentialRampToValueAtTime(0.0001,when+noteDur-0.005);
    g.gain.setValueAtTime(0,when+noteDur-0.004); // hard zero before stop
    osc.connect(g);g.connect(filt);
    osc.start(when);osc.stop(when+noteDur);
    if(SYNTH.detune>0.01){
      var osc3=ac.createOscillator(),g3=ac.createGain();
      osc3.type=type;osc3.frequency.value=freq;osc3.detune.value=SYNTH.detune*20;
      if(lfoNode){var lg3=ac.createGain();lg3.gain.value=1;lfoNode.connect(lg3);lg3.connect(osc3.frequency);}
      g3.gain.setValueAtTime(0,when);
      g3.gain.linearRampToValueAtTime(vf*amount*0.55,when+attackTime);
      g3.gain.exponentialRampToValueAtTime(0.0001,when+noteDur-0.005);
      g3.gain.setValueAtTime(0,when+noteDur-0.004);
      osc3.connect(g3);g3.connect(filt);
      osc3.start(when);osc3.stop(when+noteDur);
    }
  }
  // ── PIANO: dedicated additive synthesis path ─────────────────────────────
  if(w<0.05&&SYNTH.detune<0.05&&SYNTH.modulation<0.05){
    var inh=1+0.0004*(freq/440);
    var partials=[
      [1.000,       0.55,  1.0,   0],
      [2.000*inh,   0.18,  0.65,  4],
      [3.000*inh,   0.08,  0.45, -5],
      [4.000*inh,   0.04,  0.30,  3],
    ];
    var pianoDecay=noteDur;
    var brightFilt=ac.createBiquadFilter();
    brightFilt.type='lowpass';
    brightFilt.frequency.setValueAtTime(6000,when);
    brightFilt.frequency.exponentialRampToValueAtTime(1200,when+pianoDecay*0.6);
    brightFilt.Q.value=0.5;
    var dest2=dest;
    if(ac.createStereoPanner){
      var pp=ac.createStereoPanner();
      pp.pan.value=Math.max(-0.7,Math.min(0.7,((midi-66)/36)*0.5));
      brightFilt.connect(pp);pp.connect(dest);
    } else {
      brightFilt.connect(dest);
    }
    dest2=brightFilt;
    // Hammer click transient
    var clickOsc=ac.createOscillator(),clickG=ac.createGain();
    clickOsc.type='triangle';clickOsc.frequency.value=freq*1.5;
    clickG.gain.setValueAtTime(vf*0.12,when);
    clickG.gain.exponentialRampToValueAtTime(0.0001,when+0.015);
    clickOsc.connect(clickG);clickG.connect(dest2);
    clickOsc.start(when);clickOsc.stop(when+0.02);
    // Harmonic partials
    partials.forEach(function(p){
      var pFreq=freq*p[0];
      var pVol=vf*p[1];
      var pDur=pianoDecay*p[2];
      var osc=ac.createOscillator(),g=ac.createGain();
      osc.type='sine';osc.frequency.value=pFreq;osc.detune.value=p[3]||0;
      g.gain.setValueAtTime(0,when);
      g.gain.linearRampToValueAtTime(pVol,when+0.006);
      g.gain.exponentialRampToValueAtTime(pVol*0.3,when+0.07);
      g.gain.exponentialRampToValueAtTime(0.0001,when+pDur-0.01);
      g.gain.setValueAtTime(0,when+pDur);
      osc.connect(g);g.connect(dest2);
      osc.start(when);osc.stop(when+pDur+0.01);
    });
    return;
  }
  // ─────────────────────────────────────────────────────────────────────────
  if(w>=0.45&&w<=0.55&&SYNTH.detune<0.05){
    var drawbars=[[1,0.8],[2,0.6],[3,0.3],[4,0.4],[5,0.15],[6,0.1]];
    drawbars.forEach(function(db){
      var osc=ac.createOscillator(),g=ac.createGain();
      osc.type='sine';osc.frequency.value=freq*db[0];
      var gv=vf*db[1]*0.35;
      g.gain.setValueAtTime(0,when);
      g.gain.linearRampToValueAtTime(gv,when+attackTime);
      g.gain.exponentialRampToValueAtTime(0.0001,when+noteDur-0.005);
      g.gain.setValueAtTime(0,when+noteDur-0.004);
      osc.connect(g);g.connect(filt);
      osc.start(when);osc.stop(when+noteDur);
    });
    return;
  }

  makeOsc('triangle',triAmt);
  makeOsc('square',sqAmt);
  makeOsc('sawtooth',sawAmt);
}
function playNoteNow(midi){
  var ac=getAC();if(ac.state==='suspended')ac.resume();
  playNote(midi,ac.currentTime+0.01,1.1,0.45);
}

// Like playNote but sustained: returns gain nodes so caller can cut early on release.
function playNoteHeld(midi,when,vol){
  var ac=getAC();
  var freq=440*Math.pow(2,(midi-69)/12);
  var attackTime=Math.max(0.005,SYNTH.attack);
  var dest=_masterGain||ac.destination;
  var w=SYNTH.wave;
  var v=vol||0.3;
  var triAmt,sqAmt,sawAmt,volComp;
  if(w<=0.5){triAmt=1-w*2;sqAmt=w*2;sawAmt=0;volComp=1.6-w*1.2;}
  else{triAmt=0;sqAmt=2-w*2;sawAmt=(w-0.5)*2;volComp=1.0;}
  var vf=v*volComp;
  var sustainLvl=Math.max(0.001,SYNTH.sustain*vf);
  var cutoff=2400+w*3600+SYNTH.filterQ*400;
  var filt=ac.createBiquadFilter();
  filt.type='lowpass';filt.frequency.value=cutoff;filt.Q.value=SYNTH.filterQ*5;
  if(SYNTH.stereoWidth>0.001&&ac.createStereoPanner){
    var panner=ac.createStereoPanner();
    panner.pan.value=Math.max(-1,Math.min(1,((midi-66)/30)*SYNTH.stereoWidth));
    filt.connect(panner);panner.connect(dest);
  } else {filt.connect(dest);}
  var lfoNode=null;
  if(SYNTH.modulation>0.001){
    lfoNode=ac.createOscillator();var lfoG=ac.createGain();
    lfoNode.type='sine';lfoNode.frequency.value=Math.max(0.5,SYNTH.vibratoRate);
    lfoG.gain.value=freq*(Math.pow(2,SYNTH.modulation*12/1200)-1);
    lfoNode.connect(lfoG);lfoNode.start(when);lfoNode.stop(when+30);
  }
  var retNodes=[];
  function makeOscHeld(type,amount){
    if(amount<0.01)return;
    var osc=ac.createOscillator(),g=ac.createGain();
    osc.type=type;osc.frequency.value=freq;
    if(lfoNode){var lg=ac.createGain();lg.gain.value=1;lfoNode.connect(lg);lg.connect(osc.frequency);}
    g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vf*amount,when+attackTime);
    g.gain.exponentialRampToValueAtTime(sustainLvl*amount,when+Math.min(attackTime+0.1,0.25));
    osc.connect(g);g.connect(filt);osc.start(when);osc.stop(when+30);
    retNodes.push(g,osc);
    if(SYNTH.detune>0.01){
      var osc3=ac.createOscillator(),g3=ac.createGain();
      osc3.type=type;osc3.frequency.value=freq;osc3.detune.value=SYNTH.detune*20;
      if(lfoNode){var lg3=ac.createGain();lg3.gain.value=1;lfoNode.connect(lg3);lg3.connect(osc3.frequency);}
      g3.gain.setValueAtTime(0,when);g3.gain.linearRampToValueAtTime(vf*amount*0.55,when+attackTime);
      g3.gain.exponentialRampToValueAtTime(sustainLvl*amount*0.55,when+Math.min(attackTime+0.1,0.25));
      osc3.connect(g3);g3.connect(filt);osc3.start(when);osc3.stop(when+30);
      retNodes.push(g3,osc3);
    }
  }
  makeOscHeld('triangle',triAmt);
  makeOscHeld('square',sqAmt);
  makeOscHeld('sawtooth',sawAmt);
  return retNodes;
}
function playChordNow(mids){
  var ac=getAC();if(ac.state==='suspended')ac.resume();
  mids.forEach(function(m){playNote(m,ac.currentTime+0.01,1.8,0.45);});
}

// ── CHORD PROGRESSION PLAYBACK ENGINE ─────────────────────────────────────────
var CP={active:false,loop:false,progIdx:-1,tickTimeout:null,pos:0,seq:[],
        tempo:72,kbRef:null,
        keyChangeQueued:false,
        targetTonic:null, // specific tonic for +3 style change
        targetJump:null,  // full jump string e.g. "A Natural Minor" for rel/par changes
        rebuildSeq:null, // set when a progression starts playing
        getChordMidis:null};
var refreshProgStepUI=null; // set by refreshChordPage

// In portrait mode only: measure the frozen section above listBody and set its height
// so it fills exactly the remaining viewport. Called after render and on resize.
// Toggle portrait-chords class on #shell when chords tab is active in portrait.
// This locks the shell to 100dvh and lets the flex chain bound the chord list.

function updatePortraitChordsClass(){
  var shellEl=document.getElementById('shell');
  if(!shellEl)return;
  var isPortrait=window.matchMedia('(orientation:portrait)').matches;
  var active=isPortrait&&S.tab==='chords';
  shellEl.classList.toggle('portrait-chords',active);
}

// Simple clamped voicing: root position, centered in MIDI 48–84.
// Used as fallback only if CP.getChordMidis is not yet set.
function chordMidisClamped(rootPc,q){
  var si=TRIAD_SEMI[q]||TRIAD_SEMI['maj'];
  // Start in octave 4 (MIDI 48 = C3 in this app's scheme: mOf(pc,4)=48+pc for C)
  var rootMidi=48+rootPc;
  // Clamp so all notes fit within 48–84
  while(rootMidi+si[si.length-1]>84)rootMidi-=12;
  while(rootMidi<48)rootMidi+=12;
  return si.map(function(s){return rootMidi+s;});
}

function refreshTonicUI(){
  // Update UI for new tonic without stopping chord loop playback
  // Save CP state, call update() which rebuilds everything, then restore
  var savedCP={
    active:CP.active,loop:CP.loop,progIdx:CP.progIdx,
    pos:CP.pos,seq:CP.seq,kbRef:CP.kbRef,
    keyChangeQueued:CP.keyChangeQueued,rebuildSeq:CP.rebuildSeq,
    tempo:CP.tempo,tickTimeout:CP.tickTimeout
  };
  // Prevent update()/cpStop from killing the loop
  CP.active=false; // so cpStop inside update() is a no-op
  update();
  // Restore CP state so playback continues
  CP.active=savedCP.active;CP.loop=savedCP.loop;CP.progIdx=savedCP.progIdx;
  CP.pos=savedCP.pos;CP.seq=savedCP.seq;CP.kbRef=savedCP.kbRef;
  CP.keyChangeQueued=savedCP.keyChangeQueued;CP.rebuildSeq=savedCP.rebuildSeq;
  CP.tempo=savedCP.tempo;CP.tickTimeout=savedCP.tickTimeout;
  // Restore correct button states after update() reset them
  cpSetUI();
}

function buildProgSeqFresh(pg){
  // Rebuild a progression sequence using the current S.tonic — used for key change
  var stType=S.scaleType||'Major';
  var cd=CHORD_DEFS[stType]||CHORD_DEFS['Major'];
  var steps=SCALE_STEPS[stType]||SCALE_STEPS['Major'];
  var sem=tRow().semitone;
  var KS=48,KE=88;
  return pg.steps.map(function(deg){
    var rootPc=(sem+steps[deg])%12;
    var q=(cd[deg]||cd[0]).q;
    var si=TRIAD_SEMI[q]||TRIAD_SEMI['maj'];
    var deg0root=48+sem%12;
    var prevMidi=deg0root;
    for(var d=1;d<=deg;d++){
      var nextPc=(sem+steps[d])%12;
      var nextMidi=prevMidi-prevMidi%12+nextPc;
      if(nextMidi<=prevMidi)nextMidi+=12;
      prevMidi=nextMidi;
    }
    var rootMidi=(deg===0)?deg0root:prevMidi;
    while(rootMidi<KS)rootMidi+=12;
    while(rootMidi+si[si.length-1]>KE)rootMidi-=12;
    return si.map(function(s){return rootMidi+s;});
  });
}

function cpStop(){
  CP.active=false;CP.pos=0;CP.progIdx=-1;CP.keyChangeQueued=false;CP.targetTonic=null;CP.targetJump=null;CP.rebuildSeq=null;
  if(CP.tickTimeout)clearTimeout(CP.tickTimeout);CP.tickTimeout=null;
  if(CP.kbRef)CP.kbRef.upd([],[],rhHi(),rhDk());
  if(typeof refreshProgStepUI==='function')refreshProgStepUI();
  if(UI.updateScaleKcBtn)UI.updateScaleKcBtn();
  cpSetUI();
}

function cpTick(){
  if(!CP.active)return;
  var ac=getAC();
  var step=Math.round(60000/CP.tempo);
  var chord=CP.seq[CP.pos];
  // Hard-clamp every note to 48–84 for safety
  var clamped=chord.map(function(m){
    while(m<48)m+=12;while(m>84)m-=12;return m;
  });
  // Use exact same dur/vol as playChordNow so sound is identical to manual card taps
  clamped.forEach(function(m){playNote(m,ac.currentTime+0.01,1.8,0.45);});
  if(CP.kbRef)CP.kbRef.upd(clamped,[],rhHi(),rhDk());
  CS.progStep=CP.pos;
  if(typeof refreshProgStepUI==='function')refreshProgStepUI();
  var isLast=CP.pos>=CP.seq.length-1;
  if(isLast){
    CP.tickTimeout=setTimeout(function(){
      if(!CP.active)return;
      if(CP.loop){
        if(CP.keyChangeQueued&&CP.rebuildSeq){
          CP.keyChangeQueued=false;
          // Apply tonic change — rel/par jump, specific tonic, or default +3
          if(CP.targetJump){
            // Parse full jump string e.g. "A Natural Minor" — sets tonic AND scaleType
            var jStr=CP.targetJump;CP.targetJump=null;
            var sp=jStr.indexOf(' ');
            if(sp>0){
              var jTonic=jStr.slice(0,sp);
              var r2=TONICS.find(function(x){return x.label===jTonic||x.label.split('/')[0]===jTonic;});
              if(r2)S.tonic=r2.label;
              var jType=STYPES.find(function(x){return jStr.indexOf(x)>=0;});
              if(jType)S.scaleType=jType;
            }
            CP.targetTonic=null;
          } else if(CP.targetTonic){
            S.tonic=CP.targetTonic;CP.targetTonic=null;
          } else {
            var curSem=(TONICS.find(function(r){return r.label===S.tonic;})||TONICS[0]).semitone;
            var newSem=(curSem+3)%12;
            var newTonic=TONICS.find(function(r){return r.semitone===newSem;});
            if(newTonic)S.tonic=newTonic.label;
          }
          // Rebuild sequence for new key using stored rebuild function
          CP.seq=CP.rebuildSeq();
          if(UI.updateScaleKcBtn)UI.updateScaleKcBtn();
          refreshTonicUI();
        }
        CP.pos=0;cpTick();
      }else{cpStop();}
    },step+60);
  } else {
    CP.pos++;
    CP.tickTimeout=setTimeout(cpTick,step);
  }
}

function cpPlay(progIdx,seq,kbRef,rebuildFn){
  cpStop();
  CP.active=true;CP.progIdx=progIdx;CP.seq=seq;CP.pos=0;CP.kbRef=kbRef;
  CP.rebuildSeq=rebuildFn||null;CP.keyChangeQueued=false;
  cpTick();cpSetUI();
}

function cpSetUI(){
  if(!UI.progPlayBtns)return;
  Object.keys(UI.progPlayBtns).forEach(function(pi){
    var idx=parseInt(pi,10);
    var btns=UI.progPlayBtns[pi];
    var isThis=CP.active&&CP.progIdx===idx;
    if(btns.play)btns.play.textContent=isThis?'\u23F9':'\u25B6';
    if(btns.loop){
      btns.loop.style.color=isThis&&CP.loop?'#e8c060':'var(--sub)';
      btns.loop.style.background=isThis&&CP.loop?'rgba(232,192,96,0.15)':'transparent';
    }
  });
}

// ── METRONOME ENGINE ──────────────────────────────────────────────────────────
var MT={
  active:false,bpm:100,sig:4,denom:4,beat:0,
  tickTimeout:null,flashTimeout:null,
  tapTimes:[],
  sound:SETTINGS.defaultMetroSound||'loud',
  noAccent:false,
  persist:false
};

function mtStop(){
  MT.active=false;MT.beat=0;
  if(MT.tickTimeout)clearTimeout(MT.tickTimeout);MT.tickTimeout=null;
  if(MT.flashTimeout)clearTimeout(MT.flashTimeout);MT.flashTimeout=null;
  mtSetUI();
}

function mtClick(isAccent){
  var ac=getAC();if(ac.state==='suspended')ac.resume();
  var t=ac.currentTime;
  var accent=isAccent&&!MT.noAccent;

  if(MT.sound==='wood'){
    // Beep: triangle wave, punchy and clear with quick decay
    var osc=ac.createOscillator(),g=ac.createGain();
    osc.type='triangle';
    osc.frequency.value=accent?880:660;
    g.gain.setValueAtTime(accent?0.7:0.5,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    osc.connect(g);g.connect(ac.destination);
    osc.start(t);osc.stop(t+0.07);
  } else if(MT.sound==='rimshot'){
    // Rimshot: sine + noise blend
    var osc=ac.createOscillator(),go=ac.createGain();
    osc.type='sine';osc.frequency.value=accent?300:220;
    go.gain.setValueAtTime(accent?0.6:0.35,t);
    go.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    osc.connect(go);go.connect(ac.destination);
    osc.start(t);osc.stop(t+0.07);
    // Add crack
    var buf2=ac.createBuffer(1,ac.sampleRate*0.015,ac.sampleRate);
    var d2=buf2.getChannelData(0);
    for(var j=0;j<d2.length;j++)d2[j]=(Math.random()*2-1);
    var ns=ac.createBufferSource();ns.buffer=buf2;
    var gn=ac.createGain();
    gn.gain.setValueAtTime(accent?0.5:0.3,t);
    gn.gain.exponentialRampToValueAtTime(0.001,t+0.015);
    ns.connect(gn);gn.connect(ac.destination);
    ns.start(t);ns.stop(t+0.02);
  } else if(MT.sound==='loud'){
    // Loud: square wave high gain, cuts through clearly
    var osc3=ac.createOscillator(),g3=ac.createGain();
    var osc3b=ac.createOscillator(),g3b=ac.createGain();
    osc3.type='square';osc3.frequency.value=accent?1200:900;
    osc3b.type='sine';osc3b.frequency.value=accent?600:450;
    g3.gain.setValueAtTime(accent?0.9:0.65,t);
    g3.gain.exponentialRampToValueAtTime(0.001,t+0.04);
    g3b.gain.setValueAtTime(accent?0.5:0.35,t);
    g3b.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    osc3.connect(g3);g3.connect(ac.destination);
    osc3b.connect(g3b);g3b.connect(ac.destination);
    osc3.start(t);osc3.stop(t+0.05);
    osc3b.start(t);osc3b.stop(t+0.07);
  } else {
    var osc2=ac.createOscillator(),g2=ac.createGain();
    osc2.type='sine';
    osc2.frequency.value=accent?1050:800;
    g2.gain.setValueAtTime(accent?0.55:0.32,t);
    g2.gain.exponentialRampToValueAtTime(0.001,t+0.045);
    osc2.connect(g2);g2.connect(ac.destination);
    osc2.start(t);osc2.stop(t+0.05);
  }
}

function mtTick(){
  if(!MT.active)return;
  var step=Math.round(60000/MT.bpm);
  var isAccent=MT.beat===0;
  mtClick(isAccent);

  // Visual flash
  if(UI.mtrPulse){
    UI.mtrPulse.className='metro-pulse '+(isAccent?'beat1':'beat');
    if(MT.flashTimeout)clearTimeout(MT.flashTimeout);
    MT.flashTimeout=setTimeout(function(){
      if(UI.mtrPulse)UI.mtrPulse.className='metro-pulse';
    },step*0.35);
  }
  // Dot highlights
  if(UI.mtrDots){
    UI.mtrDots.forEach(function(d,i){
      d.className='metro-dot'+(i===MT.beat?(isAccent?' beat1':' beat'):'');
    });
  }

  MT.beat=(MT.beat+1)%MT.sig;
  MT.tickTimeout=setTimeout(mtTick,step);
}

function mtStart(){
  if(MT.active)return;
  MT.active=true;MT.beat=0;
  mtTick();
  mtSetUI();
}

function mtToggle(){
  if(MT.active)mtStop();else mtStart();
}

function mtSetUI(){
  if(UI.mtrPlayBtn){
    UI.mtrPlayBtn.className='metro-play-btn'+(MT.active?' active':'');
    UI.mtrPlayBtn.textContent=MT.active?'\u23F9':'\u25B6';
  }
}

function mtTap(){
  var now=Date.now();
  MT.tapTimes.push(now);
  // Keep only last 8 taps, discard if gap > 3s (new sequence)
  MT.tapTimes=MT.tapTimes.filter(function(t){return now-t<3000;});
  if(MT.tapTimes.length>8)MT.tapTimes=MT.tapTimes.slice(-8);
  if(MT.tapTimes.length>=2){
    var gaps=[];
    for(var i=1;i<MT.tapTimes.length;i++)gaps.push(MT.tapTimes[i]-MT.tapTimes[i-1]);
    var avg=gaps.reduce(function(a,b){return a+b;},0)/gaps.length;
    var bpm=Math.round(60000/avg);
    bpm=Math.max(30,Math.min(300,bpm));
    MT.bpm=bpm;
    if(UI.mtrBpmSlider){UI.mtrBpmSlider.value=bpm;UI.mtrBpmVal.textContent=bpm+' BPM';}
  }
}

var TR={
  active:false,loop:false,
  tickTimeout:null,
  pos:0,
  lhSeq:null,
  rhSeq:null,
  kbLH:null,kbRH:null,
  handMode:'both',
  flashTimeout:null,
  melodicAscLen:-1,
  displayDir:null,
  keyChangeQueued:false,
  keyChangeTotalSem:0,
  keyChangeOrigTonic:null
};

function buildSeq(ms){
  // Full up+down sequence including the final root (for correct single-play ending).
  // Top note not repeated. Loop mode restarts at pos=1 to skip the root it just played.
  var up=ms.slice(),dn=ms.slice().reverse();
  if(dn[0]===up[up.length-1])dn=dn.slice(1);
  return up.concat(dn); // ends on root
}

function trClearTick(){
  if(TR.tickTimeout)clearTimeout(TR.tickTimeout);
  TR.tickTimeout=null;
  if(TR.flashTimeout)clearTimeout(TR.flashTimeout);
  TR.flashTimeout=null;
}

function trStop(){
  var wasMelodic=TR.melodicAscLen>=0;
  TR.active=false;TR.pos=0;TR.melodicAscLen=-1;TR.displayDir=null;
  TR.keyChangeQueued=false;TR._targetTonic=null;TR._pendingType=null;TR._pausePending=false;TR._tickExpected=null;
  if(_countInOv){_countInOv.remove();_countInOv=null;}
  trClearTick();
  if(TR.kbLH){TR.kbLH.flash(null);TR.kbLH.restoreScale();}
  if(TR.kbRH){TR.kbRH.flash(null);TR.kbRH.restoreScale();}
  // If we were playing melodic minor and switched direction mid-play,
  // restore the user's chosen direction and redraw keyboards
  if(wasMelodic){
    var sem=tRow().semitone,name=sName();
    var lm=midis(sem,S.scaleType,S.melodicDir,LS,LE);
    var rm=midis(sem,S.scaleType,S.melodicDir,RS,RE);
    var f=gf(S.tonic,S.scaleType,S.melodicDir);
    var lf=f?f.lh:[],rf=f?f.rh:[];
    if(UI.lhKb){UI.lhKb.upd(lm,lf,lhHi(),lhDk());UI.lhKb.title.textContent='LEFT HAND \u2014 '+name;}
    if(UI.rhKb){UI.rhKb.upd(rm,rf,rhHi(),rhDk());UI.rhKb.title.textContent='RIGHT HAND \u2014 '+name;}
    if(UI.melBtns){
      ['ASC','DESC'].forEach(function(d){
        var b=UI.melBtns[d],on=d===S.melodicDir,asc=d==='ASC';
        b.style.background=on?(asc?'rgba(100,200,130,.18)':'rgba(200,100,100,.18)'):'rgba(255,255,255,0.04)';
        b.style.color=on?(asc?'#70d898':'#d87070'):'#555';
        b.style.border=on?'1px solid '+(asc?'rgba(100,200,130,.4)':'rgba(200,100,100,.4)'):'1px solid rgba(255,255,255,0.08)';
      });
    }
  }
  setTransportUI();
}

function trTick(){
  if(!TR.active)return;
  var ac=getAC();
  var step=Math.round(30000/SETTINGS.tempo);

  // Self-correcting timer: track when this tick was supposed to fire vs when it actually fired
  var now=Date.now();
  if(!TR._tickExpected)TR._tickExpected=now;
  var drift=now-TR._tickExpected; // positive = we're late
  // If drift is more than 2x the step, this was a stall (backgrounded, screen lock, GC pause)
  // not normal jitter — reset rather than trying to claw back with machine-gun ticks
  if(drift>step*2)TR._tickExpected=now;
  TR._tickExpected+=step; // next expected time
  var dur=1.1;
  var correctedStep=Math.max(8,step-drift); // compensate for late firing, min 8ms: switch displayed direction and keyboard highlight at ASC/DESC boundary.
  // Uses TR.displayDir (not S.melodicDir) so we never corrupt user's chosen direction.
  if(TR.melodicAscLen>=0){
    var dir=TR.pos<TR.melodicAscLen?'ASC':'DESC';
    if(TR.displayDir!==dir){
      TR.displayDir=dir;
      var _sem=tRow().semitone;
      var _lm=midis(_sem,'Melodic Minor',dir,LS,LE);
      var _rm=midis(_sem,'Melodic Minor',dir,RS,RE);
      var _f=gf(S.tonic,'Melodic Minor',dir);
      var _lf=_f?_f.lh:[],_rf=_f?_f.rh:[];
      var _name=S.tonic.split('/')[0]+' Melodic Minor ('+(dir==='ASC'?'Asc':'Desc')+')';
      if(UI.lhKb){UI.lhKb.upd(_lm,_lf,lhHi(),lhDk());UI.lhKb.title.textContent='LEFT HAND \u2014 '+_name;}
      if(UI.rhKb){UI.rhKb.upd(_rm,_rf,rhHi(),rhDk());UI.rhKb.title.textContent='RIGHT HAND \u2014 '+_name;}
      if(UI.melBtns){
        ['ASC','DESC'].forEach(function(d){
          var b=UI.melBtns[d],on=d===dir,asc2=d==='ASC';
          b.style.background=on?(asc2?'rgba(100,200,130,.18)':'rgba(200,100,100,.18)'):'rgba(255,255,255,0.04)';

var _countInOv=null; // global ref so trStop can clear it

function trCountIn(callback){
  var beats=4*(window.ST&&window.ST.countInBars||1);
  var stepMs=Math.round(60000/SETTINGS.tempo); // one real beat at stated BPM
  var count=0;

  // Overlay
  var ov=el('div',{style:{position:'fixed',inset:'0',zIndex:'9999',
    display:'flex',alignItems:'center',justifyContent:'center',
    pointerEvents:'none'}});
  _countInOv=ov;
  var num=el('div',{style:{fontFamily:JF,fontSize:'5rem',fontWeight:'900',
    color:'var(--text)',opacity:'0.9',textShadow:'0 4px 24px rgba(0,0,0,0.8)',
    transition:'opacity 0.1s'}});
  ov.appendChild(num);document.body.appendChild(ov);

  // Resume audio context — prevents rushed first beats on context wakeup
  var ac2=getAC();
  if(ac2.state==='suspended')ac2.resume();

  function tick(){
    count++;
    mtClick(count%4===1);
    num.textContent=String((count-1)%4+1);
    num.style.opacity='0.95';
    setTimeout(function(){num.style.opacity='0.3';},stepMs*0.4);
    if(count<beats){
      TR.tickTimeout=setTimeout(tick,stepMs);
    } else {
      TR.tickTimeout=setTimeout(function(){
        ov.remove();_countInOv=null;
        // Show Go! overlay on first beat
        var goOv=el('div',{style:{position:'fixed',inset:'0',zIndex:'9999',
          display:'flex',alignItems:'center',justifyContent:'center',
          pointerEvents:'none'}});
        var goNum=el('div',{style:{fontFamily:JF,fontSize:'5rem',fontWeight:'900',
          color:'var(--active-color)',opacity:'1',textShadow:'0 4px 24px rgba(90,170,130,0.5)',
          transition:'opacity 0.4s'}});
        goNum.textContent='Go!';
        goOv.appendChild(goNum);document.body.appendChild(goOv);
        callback();
        setTimeout(function(){goNum.style.opacity='0';},300);
        setTimeout(function(){goOv.remove();},800);
      },stepMs);
    }
  }
  // Pre-delay: enough to wake audio context but never more than half a beat
  var preDelay=Math.min(150,Math.round(stepMs*0.25));
  TR.tickTimeout=setTimeout(tick,preDelay);
}

function trPlayCurrent(){
  // Stop first — clears all old state (pos, melodicAscLen, displayDir, timeouts)
  trStop();

  var sem=tRow().semitone;
  var isMelodic=S.scaleType==='Melodic Minor';

  if(isMelodic){
    var lhAsc=midis(sem,'Melodic Minor','ASC',LS,LE);
    var lhDesc=midis(sem,'Melodic Minor','DESC',LS,LE);
    var rhAsc=midis(sem,'Melodic Minor','ASC',RS,RE);
    var rhDesc=midis(sem,'Melodic Minor','DESC',RS,RE);

    function melodicSeq(asc,desc){
      var up=asc.slice();
      var dn=desc.slice().reverse(); // top→root
      if(dn.length&&dn[0]===up[up.length-1])dn=dn.slice(1); // no repeated top
      return up.concat(dn); // ends on root — single play lands correctly
    }

    TR.rhSeq=melodicSeq(rhAsc,rhDesc);
    TR.lhSeq=melodicSeq(lhAsc,lhDesc);
    // Set AFTER trStop() so it isn't reset to -1
    TR.melodicAscLen=rhAsc.length;
    TR.displayDir=null;
  } else {
    var lhMs=midis(sem,S.scaleType,S.melodicDir,LS,LE);
    var rhMs=midis(sem,S.scaleType,S.melodicDir,RS,RE);
    TR.lhSeq=buildSeq(lhMs);
    TR.rhSeq=buildSeq(rhMs);
    TR.melodicAscLen=-1;
    TR.displayDir=null;
  }

  // Now start playback with fresh state
  var ac=getAC();if(ac.state==='suspended')ac.resume();
  TR.active=true;TR.kbLH=UI.lhKb;TR.kbRH=UI.rhKb;TR.pos=0;
  trTick();
  setTransportUI();
  if(UI.stUpdateDuration)UI.stUpdateDuration();
}

    });
  }
}

function el(tag,props,ch){
  var e=document.createElement(tag);
  if(props)Object.keys(props).forEach(function(k){
    if(k==='style')Object.assign(e.style,props[k]);
    else if(k==='cls')e.className=props[k];
    else if(k[0]==='o'&&k[1]==='n')e[k]=props[k];
    else e.setAttribute(k,props[k]);
  });
  if(ch)[].concat(ch).forEach(function(c){
    if(c==null)return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}
function shade(hex,f){
  hex=(hex||'#888888').replace('#','');
  var r=parseInt(hex.substr(0,2),16)||0,g=parseInt(hex.substr(2,2),16)||0,b=parseInt(hex.substr(4,2),16)||0;
  r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);
  r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b);
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}

function mkLayout(s,e){

  for(var m=s;m<=e;m++){
    if(isW(m)){ws.push({midi:m,wi:wi});if(m+1<=e&&!isW(m+1))bs.push({midi:m+1,awi:wi});wi++;}
  }
  return{whites:ws,blacks:bs};
}

function mkKb(label,sM,eM){

  });

  var lr=el('div',{style:{position:'relative',height:'13px',width:TW+'px',margin:'2px auto 0'}});
  lay.whites.forEach(function(wk){
    var d=el('div',{style:{position:'absolute',left:(wk.wi*W)+'px',width:(W-1)+'px',
      textAlign:'center',fontSize:'0.38rem',fontFamily:JF,color:'var(--note-num)',fontWeight:'400'}},
      PC[pcOf(wk.midi)].replace(SH,'#')+ocOf(wk.midi));
    lr.appendChild(d);ln.push({n:d,midi:wk.midi});

  lr.style.display=SETTINGS.showNoteNames?'':'none';
  UI._noteNameRows=UI._noteNameRows||[];UI._noteNameRows.push(lr);
  cv.appendChild(ka);cv.appendChild(lr);wrap.appendChild(cv);

  function upd(sm,fa,hw,dk){
    if(hw)_hw=hw;if(dk)_dk=dk;
    if(sm.length)_lastSM=sm.slice();
    if(fa.length)_lastFA=fa.slice();
    var mf={};for(var i=0;i<_lastSM.length;i++){if(_lastFA[i]!=null)mf[_lastSM[i]]=_lastFA[i];}
    var ss={};_lastSM.forEach(function(m){ss[m]=true;});
    wn.forEach(function(w){
      var inS=!!ss[w.midi],f=mf[w.midi];
      var isFlash=(_flashMidi===w.midi);
      var isHC=SETTINGS.theme==='hc';
      if(inS){
        if(isHC){
          w.n.style.background=isFlash?'#ffaa00':'#ffff00';
          w.n.style.border='2px solid #000000';
          w.n.style.boxShadow='none';
        } else {
          w.n.style.background='linear-gradient(180deg,'+_hw+' 0%,'+_hw+' 65%,'+_dk+'55 100%)';
          w.n.style.border='1px solid '+_dk+'88';
          w.n.style.boxShadow='inset 0 -4px 0 '+_dk;
        }
        w.n.style.filter=isFlash?'brightness(0.80)':'';
      } else {
        w.n.style.background='var(--wkey)';
        w.n.style.border='1px solid var(--wborder)';
        w.n.style.boxShadow='inset 0 -2px 4px rgba(0,0,0,.1)';
        w.n.style.filter='';
      }
      if(inS&&f!=null){w.lb.textContent=''+f;w.lb.style.color=isHC?'#000000':shade(_dk,0.5);w.lb.style.display='';}
      else w.lb.style.display='none';
    });
    bn.forEach(function(b){
      var inS=!!ss[b.midi],f=mf[b.midi];
      var isFlash=(_flashMidi===b.midi);
      var isHC=SETTINGS.theme==='hc';
      if(inS){
        if(isHC){
          b.n.style.background=isFlash?'#ffaa00':'#ffff00';
          b.n.style.boxShadow='0 0 0 2px #000000';
          b.n.style.outline='2px solid #000000';
          b.n.style.filter='';
        } else {
          var bHiShade=shade(_dk,0.9);
          b.n.style.background='linear-gradient(180deg,'+_dk+' 0%,'+_dk+' 55%,'+bHiShade+' 100%)';
          b.n.style.boxShadow='0 3px 10px '+_dk+'88';
          b.n.style.outline='';
          b.n.style.filter=isFlash?'brightness(1.35)':'';
        }
      } else {
        b.n.style.background='var(--bkey)';
        b.n.style.boxShadow='0 3px 7px rgba(0,0,0,.7)';
        b.n.style.outline='';
        b.n.style.filter='';
      }
      if(inS&&f!=null){
        b.lb.textContent=''+f;
        b.lb.style.color=isHC?'#000000':'';
        b.lb.style.textShadow=isHC?'none':'';
        b.lb.style.display='';
      }
      else b.lb.style.display='none';
    });
    ln.forEach(function(l){
      var inS=!!ss[l.midi];
      l.n.style.color=inS?_dk:'var(--note-num)';l.n.style.fontWeight=inS?'700':'400';
    });
  }
  // Flash: set the midi to highlight during playback (scale stays visible)
  function flash(midi){
    _flashMidi=midi;
    upd([],[]);
  }
  // Restore: clear flash and redisplay full scale
  function restoreScale(){
    _flashMidi=null;
    upd([],[]);
  }
  return{wrap:wrap,upd:upd,flash:flash,restoreScale:restoreScale,title:titleDiv,cv:cv,setEditorTap:setEditorTap};
}

// ── FINGERING EDITOR ──────────────────────────────────────────────────────────
var FE={key:null,draft:null,dirty:false};
function buildEditorPanel(){
  var wrap=el("div",{style:{paddingBottom:"24px"}});
  FE.title=el("div",{style:{fontFamily:JF,fontSize:"0.92rem",fontWeight:"700",marginBottom:"8px",color:"var(--text)"}},"");
  wrap.appendChild(FE.title);
  wrap.appendChild(el('p',{style:{fontSize:'0.62rem',color:'#666',fontFamily:JF,letterSpacing:'0.04em',marginBottom:'10px',lineHeight:'1.6'}},
    'Select a scale. Tap any highlighted key to cycle its finger number (1\u21922\u21923\u21924\u21925\u21921).'));

  FE.rhKb=mkKb("RIGHT HAND",RS,RE);
  FE.lhKb=mkKb("LEFT HAND",LS,LE);
  wrap.appendChild(FE.rhKb.wrap);
  wrap.appendChild(FE.lhKb.wrap);

  // Keyboard scroll sync — mirrors scales page behaviour, shares KBS.sync state
  (function(){
    var rhCv=FE.rhKb.cv,lhCv=FE.lhKb.cv;
    var syncing=false;
    rhCv.addEventListener('scroll',function(){
      if(!KBS.sync||syncing)return;
      syncing=true;lhCv.scrollLeft=rhCv.scrollLeft;syncing=false;
    });
    lhCv.addEventListener('scroll',function(){
      if(!KBS.sync||syncing)return;
      syncing=true;rhCv.scrollLeft=lhCv.scrollLeft;syncing=false;
    });
  })();

  // Bound/Unbound toggle — same style as scales page
  var feSyncRow=el('div',{style:{display:'flex',justifyContent:'flex-end',padding:'4px 0 6px',alignItems:'center',gap:'6px'}});
  feSyncRow.appendChild(el('span',{style:{fontSize:'0.5rem',color:'var(--sub)',fontFamily:JF,letterSpacing:'0.06em'}},'SCROLL SYNC'));
  FE.syncBtn=el('button',{cls:'kb-sync-btn'+(KBS.sync?' active':'')},KBS.sync?'Bound':'Unbound');
  FE.syncBtn.onclick=function(){
    KBS.sync=!KBS.sync;
    // Update both pages' buttons together
    if(UI.syncBtn){UI.syncBtn.className='kb-sync-btn'+(KBS.sync?' active':'');UI.syncBtn.textContent=KBS.sync?'Bound':'Unbound';}
    FE.syncBtn.className='kb-sync-btn'+(KBS.sync?' active':'');
    FE.syncBtn.textContent=KBS.sync?'Bound':'Unbound';
    if(KBS.sync){FE.rhKb.cv.scrollLeft=0;FE.lhKb.cv.scrollLeft=0;}
  };
  feSyncRow.appendChild(FE.syncBtn);
  wrap.appendChild(feSyncRow);

  function applyFinger(hand,midi,val){
    if(!FE.draft)return;
    var arr=hand==="rh"?FE.draft.rh:FE.draft.lh;
    var kb=hand==="rh"?FE.rhKb:FE.lhKb;
    var row=hand==="rh"?FE.rh:FE.lh;
    var sem=tRow().semitone,st=S.scaleType;
    var dir=st==="Melodic Minor"?"ASC":(S.melodicDir||"ASC");
    var ms=midis(sem,st,dir,hand==="rh"?RS:LS,hand==="rh"?RE:LE);
    var pos=ms.indexOf(midi);
    if(pos<0||pos>=arr.length)return;
    arr[pos]=val;
    FE.dirty=true;updateFEStatus();
    kb.upd(ms,arr,hand==="rh"?rhHi():lhHi(),hand==="rh"?rhDk():lhDk());
    // Sync input table
    if(row&&row.inputs[pos])row.inputs[pos].value=String(val);
  }

  function makeTapHandler(hand){
    return function(midi){
      if(!FE.draft)return;
      var arr=hand==="rh"?FE.draft.rh:FE.draft.lh;
      var sem=tRow().semitone,st=S.scaleType;
      var dir=st==="Melodic Minor"?"ASC":(S.melodicDir||"ASC");
      var ms=midis(sem,st,dir,hand==="rh"?RS:LS,hand==="rh"?RE:LE);
      var pos=ms.indexOf(midi);
      if(pos<0||pos>=arr.length)return;
      applyFinger(hand,midi,(arr[pos]%5)+1);
    };
  }
  FE.rhKb.setEditorTap(makeTapHandler("rh"));
  FE.lhKb.setEditorTap(makeTapHandler("lh"));

  // Input tables — type directly or use tap-to-cycle above; both stay in sync
  function mkRow(hand,label){
    var inputs=[],cells=[];
    wrap.appendChild(el('div',{cls:'fe-hl'},label));
    var row=el('div',{cls:'fe-inputs',style:{flexWrap:'wrap'}});
    for(var i=0;i<49;i++){
      (function(idx){
        var inp=el('input',{cls:'fe-inp',type:'number',inputmode:'numeric',min:'1',max:'5',value:'1'});
        inp.addEventListener('input',function(){
          if(!FE.draft)return;
          var v=parseInt(inp.value,10);if(isNaN(v))return;
          v=Math.max(1,Math.min(5,v));
          var arr=hand==='rh'?FE.draft.rh:FE.draft.lh;
          arr[idx]=v;
          // For chromatic: auto-mirror ascending into descending half
          if(S.scaleType==='Chromatic'&&idx<25){
            var asc=arr.slice(0,25);
            var dn=asc.slice().reverse();if(dn[0]===asc[asc.length-1])dn=dn.slice(1);
            for(var di=0;di<dn.length;di++) arr[25+di]=dn[di];
          }
          // For pentatonic: auto-mirror ascending into descending half
          if((S.scaleType==='Major Pentatonic'||S.scaleType==='Minor Pentatonic')&&idx<6){
            var ascP=arr.slice(0,6);
            var dnP=ascP.slice().reverse();if(dnP[0]===ascP[ascP.length-1])dnP=dnP.slice(1);
            for(var diP=0;diP<dnP.length;diP++) arr[6+diP]=dnP[diP];
          }
          FE.dirty=true;updateFEStatus();
          // Sync keyboard display
          var kb=hand==='rh'?FE.rhKb:FE.lhKb;
          var sem=tRow().semitone,st=S.scaleType;
          var dir=st==='Melodic Minor'?'ASC':(S.melodicDir||'ASC');
          var ms=midis(sem,st,dir,hand==='rh'?RS:LS,hand==='rh'?RE:LE);
          kb.upd(ms,arr,hand==='rh'?rhHi():lhHi(),hand==='rh'?rhDk():lhDk());
        });
        var cell=el('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'2px'}});
        cell.appendChild(el('span',{style:{fontSize:'0.42rem',color:'#444',fontFamily:JF}},String(idx+1)));
        cell.appendChild(inp);
        cells.push(cell);inputs.push(inp);row.appendChild(cell);
      })(i);
    }
    wrap.appendChild(row);
    return{inputs:inputs,cells:cells};
  }
  FE.rh=mkRow('rh','RIGHT HAND');
  FE.lh=mkRow('lh','LEFT HAND');

  var actions=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginTop:'12px',flexWrap:'wrap'}});
  FE.saveBtn=el('button',{style:{padding:'9px 22px',borderRadius:'14px',background:'linear-gradient(135deg,var(--active-color),#3d8a64)',color:'#fff',fontFamily:JF,fontSize:'0.74rem',fontWeight:'700',letterSpacing:'0.06em',boxShadow:'0 3px 12px rgba(90,170,130,.4)'}},'✓ Save');
  FE.saveBtn.onclick=function(){
    if(!FE.key)return;
    FING[FE.key]={lh:FE.draft.lh.slice(),rh:FE.draft.rh.slice()};
    persist();FE.dirty=false;updateFEStatus();update();
    if(FE.key)loadEditorScale(FE.key,true);
  };
  actions.appendChild(FE.saveBtn);
  FE.status=el('span',{style:{fontFamily:JF,fontSize:'0.68rem',letterSpacing:'0.05em'}},'Saved');
  actions.appendChild(FE.status);wrap.appendChild(actions);
  FE.restoreBtn=el('button',{cls:'fe-rst',style:{marginTop:'10px'}},'\u21BA Restore this scale to default');
  FE.restoreBtn.onclick=function(){
    if(!FE.key)return;
    if(!confirm('Restore defaults?'))return;
    FING[FE.key]=JSON.parse(JSON.stringify(DEF[FE.key]));
    persist();loadEditorScale(FE.key,true);update();
  };
  wrap.appendChild(FE.restoreBtn);
  FE.restoreAllBtn=el('button',{cls:'fe-rst',style:{marginTop:'10px',marginLeft:'10px'}},'\u21BA Restore ALL scales to defaults');
  FE.restoreAllBtn.onclick=function(){
    if(!confirm('Restore ALL scales to defaults? This will reset every stored fingering for every scale.'))return;
    FING=JSON.parse(JSON.stringify(DEF));
    persist();if(FE.key)loadEditorScale(FE.key,true);update();
  };
  wrap.appendChild(FE.restoreAllBtn);
  return wrap;
}
function updateFEStatus(){
  if(!FE.status)return;
  if(FE.dirty){FE.status.textContent='\u25CF Unsaved';FE.status.style.color='#e0a040';}
  else{FE.status.textContent='\u2713 Saved';FE.status.style.color='var(--active-color)';}
}
function loadEditorScale(key,force){
  if(!FE.rhKb)return;
  if(key===FE.key&&!force)return;
  FE.key=key;
  var src=FING[key]||DEF[key];
  FE.draft={lh:src.lh.slice(),rh:src.rh.slice()};
  FE.dirty=false;
  FE.title.textContent=key;
  updateFEStatus();
  var isArp=key.indexOf('Arpeggio')>=0,isChrom=key.indexOf('Chromatic')>=0,isPent=key.indexOf('Pentatonic')>=0;
  var len=isArp?7:isChrom?25:isPent?6:15;
  // For chromatic: editor shows 25 (ascending only), descending is mirrored automatically
  if(isChrom&&FE.draft){
    // Ensure full 49 entries exist — mirror ascending if needed
    if(FE.draft.rh.length<=25){
      var rhAsc=FE.draft.rh.slice(0,25);
      var rhDn=rhAsc.slice().reverse();if(rhDn[0]===rhAsc[rhAsc.length-1])rhDn=rhDn.slice(1);
      FE.draft.rh=rhAsc.concat(rhDn);
    }
    if(FE.draft.lh.length<=25){
      var lhAsc=FE.draft.lh.slice(0,25);
      var lhDn=lhAsc.slice().reverse();if(lhDn[0]===lhAsc[lhAsc.length-1])lhDn=lhDn.slice(1);
      FE.draft.lh=lhAsc.concat(lhDn);
    }
  }
  // Populate input tables
  if(FE.lh&&FE.rh){
    for(var i=0;i<49;i++){
      var show=i<len;
      FE.lh.cells[i].style.display=show?'':'none';
      FE.rh.cells[i].style.display=show?'':'none';
      FE.lh.inputs[i].value=show?FE.draft.lh[i]:'';
      FE.rh.inputs[i].value=show?FE.draft.rh[i]:'';
    }
  }
  // Update keyboards
  if(FE.rhKb&&FE.lhKb){
    var sem=tRow().semitone;
    var st=S.scaleType;
    var dir=st==='Melodic Minor'?'ASC':(S.melodicDir||'ASC');
    FE.rhKb.upd(midis(sem,st,dir,RS,RE),FE.draft.rh,rhHi(),rhDk());
    FE.lhKb.upd(midis(sem,st,dir,LS,LE),FE.draft.lh,lhHi(),lhDk());
    FE.rhKb.title.textContent='RIGHT HAND \u2014 '+key+' (tap key to cycle finger)';
    FE.lhKb.title.textContent='LEFT HAND \u2014 '+key+' (tap key to cycle finger)';
  }
}

// ── PSS-470 KEYBOARD PAGE ─────────────────────────────────────────────────────
// Each patch overrides SYNTH params to approximate the PSS-470 voice character.
// ── MELODY PAD STATE & CHORD LOOP ENGINE ──────────────────────────────────────
var ML={
  active:false,
  loop:true,
  arpMode:false,
  arpTarget:null,   // null=no change queued, true/false=desired state at next bar 1
  minorQueued:null,
  padCount:8,         // 8 or 12 melody pads // null=no change, true/false=desired ML.minor at next bar 1
  minor:false,
  progKey:'Major',
  progIdx:-1,
  step:0,
  nextChordTime:0,
  tickTimeout:null,
  tonic:S.tonic,
  originalTonic:null,
  keyChangeQueued:false,
  keyResetQueued:false,
  lastKeyChangeBar:0,
  lastBarRegistered:0
};

function mlChordMidis(step){
  var stType=ML.progKey;
  var qualityType=ML.minor?'Natural Minor':'Major';
  var cd=CHORD_DEFS[qualityType]||CHORD_DEFS['Major'];
  var steps2=SCALE_STEPS[qualityType]||SCALE_STEPS['Major'];
  var sem=(TONICS.find(function(r){return r.label===ML.tonic;})||TONICS[0]).semitone;
  var prog=PROGRESSIONS[stType];if(!prog||ML.progIdx<0)return[];
  var progSteps=prog[ML.progIdx].steps;
  var degIdx=progSteps[step];
  var q=(cd[degIdx]||cd[0]).q;
  var si=TRIAD_SEMI[q]||[0,4,7];

  // Simple ascending walk from tonic in octave 4
  var deg0root=60+sem%12;while(deg0root<KS)deg0root+=12;
  var prev=deg0root;
  for(var d=1;d<=degIdx;d++){
    var nextPc=(sem+steps2[d])%12;
    var next=prev-prev%12+nextPc;
    if(next<=prev)next+=12;
    prev=next;
  }
  var rootMidi=(degIdx===0)?deg0root:prev;
  while(rootMidi<KS)rootMidi+=12;
  while(rootMidi+si[si.length-1]>KE)rootMidi-=12;
  return si.map(function(s){return rootMidi+s;});
}

function mlPlayChord(mids,t,dur){
  var ac=getAC();
  if(!dur)dur=60.0/DR.bpm*2;
  var dest=_mlChordGain||_masterGain||ac.destination;
  if(ML.arpMode){
    // Root in octave 4, fifth above, octave above root
    // Pattern: root, fifth, octave, fifth — matches user description C G C G
    var r=mids[0]; // use exact chord root — same as what chord mode plays
    var fifth=r+7;
    var oct=r+12;
    // 4 notes per chord slot: root-fifth-octave-fifth
    var arpNotes=[r,fifth,oct,fifth];
    var noteDur=dur/4;
    arpNotes.forEach(function(m,i){
      playNote(m,t+i*noteDur,noteDur/SYNTH.decay,0.42,dest);
    });
    return;
  }
  mids.forEach(function(m){
    playNote(m,t,dur/SYNTH.decay,0.45,dest);
  });
}

function mlApplyKeyChange(barTime){
  if(!ML.active)return;
  // Deduplicate: ignore if this barTime already processed
  if(ML.lastKeyChangeBar&&Math.abs(ML.lastKeyChangeBar-barTime)<0.05)return;
  // Only fire if a change is actually queued
  if(!ML.keyChangeQueued&&!ML.keyResetQueued)return;
  ML.lastKeyChangeBar=barTime;
  var changed=false;
  if(ML.keyResetQueued&&ML.originalTonic){
    ML.tonic=ML.originalTonic;ML.originalTonic=null;
    ML.keyChangeQueued=false;ML.keyResetQueued=false;changed=true;
  } else if(ML.keyChangeQueued){
    if(!ML.originalTonic)ML.originalTonic=ML.tonic;
    var sem=(TONICS.find(function(r){return r.label===ML.tonic;})||TONICS[0]).semitone;
    var newTonic=TONICS.find(function(r){return r.semitone===(sem+3)%12;});
    if(newTonic)ML.tonic=newTonic.label;
    ML.keyChangeQueued=false;changed=true;
  }
  if(changed){
    mlUpdateKeyChangeBtns();
    mlApplyKeyChangeToPads();
  }
}
// Refreshes melody pad labels/colours/midi for the current ML.tonic/ML.minor.

// calling update(), which rebuilds the whole pad grid and would orphan the held note.
// Only does a full rebuild (update()) when nothing is held, since that's cheaper/simpler

function mlApplyKeyChangeToPads(){
  var anyHeld=Object.keys(CP_PAD.activeNodes).some(function(k){return CP_PAD.activeNodes[k]&&CP_PAD.activeNodes[k].length;});
  if(!anyHeld){update();return;}
  // Update pad buttons in-place without rebuilding DOM
  // This avoids destroying held pointers and oscillators
  var noteNames2=['C','C\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'];
  var mlSem2=(TONICS.find(function(r){return r.label===ML.tonic;})||TONICS[0]).semitone;
  var mlScaleType2=ML.minor?'Natural Minor':'Major';
  var mlIvs2=IV[mlScaleType2]||IV['Major'];

  var iv2idx=0;
  while(mlMidis2.length<ML.padCount){cur2+=mlIvs2[iv2idx%mlIvs2.length];mlMidis2.push(cur2);iv2idx++;}

  // Update each pad button label and crossfade any held notes to new pitch

      var noteName=noteNames2[midi%12];
      var octave=Math.floor(midi/12)-1;
      var numEl=p.querySelector('.cpad-pad-numeral');
      var nameEl=p.querySelector('.cpad-pad-name');
      if(numEl)numEl.textContent=noteName;
      if(nameEl)nameEl.textContent=noteName+octave;
      // Update pad colour
      var tCol=(TONICS.find(function(r){return r.semitone===midi%12;})||{color:'#445566'}).color;
      p.style.background=tCol;

      p._padMidi=midi;
      // Crossfade held note to new pitch if active
      var nodes=CP_PAD.activeNodes[idx];
      if(nodes&&nodes.length){

        var newNodes=playNoteHeld(midi,now2+0.02,0.45*PAD_VOL);
        // Fade out old nodes quickly
        nodes.forEach(function(n){

        Object.keys(_padPtrs2).forEach(function(k){

function mlScheduler(){

  while(ML.nextChordTime<ac.currentTime+1.5){

        ML.lastBarRegistered=barTime;

        setTimeout(function(){

          if(ML.minorQueued!==null){

            mlSetUI();

            // Update melody pads in-place — same approach as key change
            // Recalculate MIDIs for new major/minor quality
            var noteNames3=['C','C\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'];
            var mlSem3=(TONICS.find(function(r){return r.label===ML.tonic;})||TONICS[0]).semitone;
            var mlScaleType3=ML.minor?'Natural Minor':'Major';
            var mlIvs3=IV[mlScaleType3]||IV['Major'];
            var mlMidis3=[];var m3=48+mlSem3;while(m3<48)m3+=12;
            mlMidis3.push(m3);var cur3=m3;
            var iv3idx=0;
            while(mlMidis3.length<ML.padCount){cur3+=mlIvs3[iv3idx%mlIvs3.length];mlMidis3.push(cur3);iv3idx++;}
            var now3b=getAC().currentTime;
            var gridEl3=UI.ppP?UI.ppP.querySelector('.cpad-grid'):null;
            if(gridEl3){
              var pads3=gridEl3.querySelectorAll('.cpad-pad[data-pad-idx2]');
              pads3.forEach(function(p){
                var idx=parseInt(p.getAttribute('data-pad-idx2'));
                var midi=mlMidis3[idx];
                if(midi===undefined)return;
                var noteName=noteNames3[midi%12];
                var octave=Math.floor(midi/12)-1;
                var numEl=p.querySelector('.cpad-pad-numeral');
                var nameEl=p.querySelector('.cpad-pad-name');
                if(numEl)numEl.textContent=noteName;
                if(nameEl)nameEl.textContent=noteName+octave;
                var tCol=(TONICS.find(function(r){return r.semitone===midi%12;})||{color:'#445566'}).color;
                p.style.background=tCol;
                p._padMidi=midi;
                // Crossfade any held note to new pitch
                var nodes=CP_PAD.activeNodes[idx];
                if(nodes&&nodes.length){
                  var newNodes=playNoteHeld(midi,now3b+0.02,0.45*PAD_VOL);
                  nodes.forEach(function(n){
                    if(n&&n.gain){try{n.gain.cancelScheduledValues(now3b);n.gain.setValueAtTime(n.gain.value,now3b);n.gain.linearRampToValueAtTime(0,now3b+0.05);}catch(e){}}
                    else if(n){try{n.stop(now3b+0.06);}catch(e){}}
                  });
                  CP_PAD.activeNodes[idx]=newNodes;
                  Object.keys(_padPtrs2).forEach(function(k){
                    if(_padPtrs2[k]&&_padPtrs2[k].idx===idx){_padPtrs2[k].nodes=newNodes;_padPtrs2[k].padEl=p;}
                  });
                }
              });
            }
            // Only full rebuild if nothing held
            var anyHeld3=Object.keys(CP_PAD.activeNodes).some(function(k){return CP_PAD.activeNodes[k]&&CP_PAD.activeNodes[k].length;});
            if(!anyHeld3&&S.tab==='pads'&&UI.ppP){
              var sML={active:ML.active,loop:ML.loop,step:ML.step,nextChordTime:ML.nextChordTime,tickTimeout:ML.tickTimeout};
              UI.ppP.innerHTML='';UI.ppP.appendChild(buildChordPadPage());
              ML.active=sML.active;ML.loop=sML.loop;ML.step=sML.step;ML.nextChordTime=sML.nextChordTime;ML.tickTimeout=sML.tickTimeout;
              mlSetUI();
            }
          }
          // Apply key change (tonic + pad update only — no restart inside)
          if(ML.keyChangeQueued||ML.keyResetQueued){
            mlApplyKeyChange(barTime);
            needRestart=true;
          }
          // Single unified restart — only once regardless of what changed
          if(needRestart){
            mlKillChordAudio();
            if(ML.tickTimeout)clearTimeout(ML.tickTimeout);
            ML.step=0;
            var ac3=getAC();var now3=ac3.currentTime;
            // Use barTime directly — this IS the bar boundary we're at
            // If slightly in the past (callback fired late), that's fine —
            // the scheduler while loop will immediately catch up from barTime
            // and schedule the first chord at barTime which Web Audio
            // plays at exactly the right time even if scheduled slightly late
            ML.nextChordTime=barTime;
            ML.lastBarRegistered=0;
            mlScheduler();
          }
        }, msUntilBar);
      }
    }
    var steps3=prog[ML.progIdx].steps;
    var mids=mlChordMidis(ML.step);

    // Odd steps are skipped to avoid overlapping arpeggios
    if(mids.length)mlPlayChord(mids,ML.nextChordTime,chordSec);
    ML.step=(ML.step+1)%steps3.length;
    if(ML.step===0&&!ML.loop){ML.active=false;mlSetUI();return;}
    ML.nextChordTime+=chordSec;
  }

function mlStart(){
  mlStop();
  var ac=getAC();if(ac.state==='suspended')ac.resume();
  ML.active=true;ML.step=0;
  var now=ac.currentTime;
  var chordSec=60.0/DR.bpm*2; // one chord = 2 beats
  var barSec=60.0/DR.bpm*4;   // one bar = 4 beats = 2 chords

  if(DR.active&&DR.epochTime>0){
    // Snap to next bar boundary (4-beat grid from epoch)
    // so chord 1 always lands on beat 1 of the bar
    var elapsed=now-DR.epochTime;
    var barsElapsed=Math.floor(elapsed/barSec);
    var nextBarTime=DR.epochTime+(barsElapsed+1)*barSec;
    if(nextBarTime<now+0.05)nextBarTime+=barSec; // ensure we're ahead
    ML.nextChordTime=nextBarTime;
  } else {
    // No drums running — set our own epoch and start on next beat
    var beatSec=60.0/DR.bpm;
    DR.epochTime=now+beatSec;
    ML.nextChordTime=DR.epochTime;
    // If drums start later, they'll use their own epochTime
  }
  mlScheduler();mlSetUI();
}
function mlKillChordAudio(){
  // Disconnect _mlChordGain from the graph — instantly silences ALL scheduled chord audio
  // regardless of lookahead. Then recreate it fresh for next use.
  if(_mlChordGain){
    try{_mlChordGain.disconnect();}catch(e){}
  }
  var ac=getAC();
  _mlChordGain=ac.createGain();
  _mlChordGain.gain.value=1.0;
  _mlChordGain.connect(_masterGain||ac.destination);
}

// clears the pad's pressed visual, and clears its pointer tracking entry.
// Global-scope equivalent of mlPadRelease (which lives inside the pad-grid closure)
// so real teardown sites (leaving Pads tab, switching pad mode, app backgrounded) can call it.
function mlKillHeldPadAudio(){
  var ac=getAC();var now=ac.currentTime;var decay=(typeof SYNTH!=='undefined'&&SYNTH.decay)||0.15;
  Object.keys(_padPtrs2).forEach(function(k){
    var ptr=_padPtrs2[k];
    if(!ptr||ptr.type!=='melody')return;
    if(ptr.padEl)try{ptr.padEl.classList.remove('pressed');}catch(e){}
    var nodes=ptr.nodes;
    if(nodes)nodes.forEach(function(n){
      if(!n)return;
      if(n.gain){try{n.gain.cancelScheduledValues(now);n.gain.setValueAtTime(n.gain.value,now);n.gain.exponentialRampToValueAtTime(0.001,now+decay);}catch(e){}}
      else{try{n.stop(now+decay+0.05);}catch(e){}}

    delete _padPtrs2[k];
  });
}

function drKick(ac,t,accent){

  g.gain.setValueAtTime((accent?3.5:2.8)*DR.vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  osc.connect(g);g.connect(ac.destination);osc.start(t);osc.stop(t+0.2);
}

  var g=ac.createGain();g.gain.setValueAtTime((loud?3.2:1.8)*DR.vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);

function drScheduler(){
  if(!DR.active)return;
  var ac=getAC();
  var stepSec=60.0/DR.bpm/4;

  while(DR.nextBeatTime<ac.currentTime+0.2){
    var step=DR.beat%16;
    var t=DR.nextBeatTime;

    // Apply queued pattern change at step 15 (last 16th of the bar)
    // New pattern then plays from beat 1 of next bar
    // Fire pattern change at step 15 every 2nd drum loop (= one chord bar = 32 steps)
    if(step===15){
      DR.barPassCount=(DR.barPassCount+1)%2;
      if(DR.barPassCount===0&&DR.patternQueued){
        DR.pattern=DR.patternQueued;
        DR.lastPattern=DR.patternQueued;
        DR.patternQueued=null;
        DR.patternBarScheduled=0;
        drUpdatePatternBtns();
      }
    }

    if(DR.fillQueued&&!DR.fillPlaying){
      DR.fillPlaying=true;DR.fillQueued=false;drUpdateFillBtn();
    }
    if(DR.fillPlaying&&step===15){
      DR.fillPlaying=false;drUpdateFillBtn();
    }

    var patKey=DR.fillPlaying?('fill_'+DR.lastPattern):DR.pattern;
    var p=DR.patterns[patKey]||DR.patterns[DR.pattern];

    if(p.kick&&p.kick[step])drKick(ac,t,step===0);
    if(p.snare&&p.snare[step])drSnare(ac,t,false);
    if(p.hat&&p.hat[step])drHat(ac,t,false);
    if(p.open&&p.open[step])drHat(ac,t,true);
    if(p.crash&&p.crash[step])drCrash(ac,t);
    DR.beat=(DR.beat+1)%16;
    DR.nextBeatTime+=stepSec;
  }
  DR.tickTimeout=setTimeout(drScheduler,100);
}

function drUpdateFillBtn(){
