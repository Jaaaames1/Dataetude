    btn.className='cpad-drum-btn'+(DR.fillQueued||DR.fillPlaying?' active':'');
    btn.textContent=DR.fillPlaying?'\u25B6Fill':'\u2935 Fill';
  });
}

function drSetPlayStopBtn(playing){
  [UI.cpadStopBtnPortrait,UI.cpadStopBtnSidebar].filter(Boolean).forEach(function(btn){
    btn.textContent=playing?'\u23F9':'\u25B6';
    btn.className='cpad-drum-btn'+(playing?' active':' off');
  });
}

function drStart(pattern){
  drStop();
  var ac=getAC();if(ac.state==='suspended')ac.resume();
  DR.pattern=pattern;DR.lastPattern=pattern;DR.active=true;DR.beat=0;
  DR.fillQueued=false;DR.fillPlaying=false;DR.patternQueued=null;
  DR.lastBarRegistered=0;DR.patternBarScheduled=0;DR.barPassCount=0;

  var now=ac.currentTime;
  if(ML.active&&ML.nextChordTime>0){
    // Chord loop already running — snap drums to next chord bar boundary
    // Same mechanism mlStart uses to sync to drums
    var chordSec=60.0/DR.bpm*2;
    var barSec=chordSec*4; // one chord bar = 4 chords
    var elapsed=now-ML.nextChordTime;
    var barsElapsed=Math.floor(elapsed/barSec);
    var nextBarTime=ML.nextChordTime+(barsElapsed+1)*barSec;
    if(nextBarTime<now+0.05)nextBarTime+=barSec;
    // epochTime is the bar boundary drums will start from
    DR.epochTime=nextBarTime;
    DR.nextBeatTime=nextBarTime;
  } else {
    DR.nextBeatTime=now+0.05;
    DR.epochTime=DR.nextBeatTime;
  }
  drScheduler();
}
// tapAction: fires fn only if pointer moves <8px — tap fires, scroll doesn't
function tapAction(el,fn){
  var sx,sy,moved;
  el.addEventListener('pointerdown',function(ev){sx=ev.clientX;sy=ev.clientY;moved=false;},{passive:true});
  el.addEventListener('pointermove',function(ev){
    if(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8)moved=true;
  },{passive:true});
  el.addEventListener('pointerup',function(ev){
    if(!moved){
      // Only stopPropagation if this pointer isn't holding a chord or melody pad
      var heldPad=(_padPtrs&&_padPtrs[ev.pointerId])||(_padPtrs2&&_padPtrs2[ev.pointerId]);
      if(!heldPad)ev.stopPropagation();
      fn(ev);
    }
  });
}
// Like tapAction but doesn't stopPropagation on pointerup — so held pads keep sustaining
function tapActionSustain(el,fn){
  var sx,sy,moved;
  el.addEventListener('pointerdown',function(ev){
    ev.stopPropagation();
    try{el.setPointerCapture(ev.pointerId);}catch(e){}
    sx=ev.clientX;sy=ev.clientY;moved=false;
  });
  el.addEventListener('pointermove',function(ev){
    if(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8)moved=true;
  },{passive:true});
  el.addEventListener('pointerup',function(ev){
    try{el.releasePointerCapture(ev.pointerId);}catch(e){}
    if(!moved)fn(ev);
  });
}

function drUpdatePatternBtns(){
  var activeId=DR.active?DR.pattern:'';
  var queuedId=DR.patternQueued;
  [UI.cpadDrumBtnsPortrait,UI.cpadDrumBtnsSidebar].filter(Boolean).forEach(function(btns){
    Object.keys(btns).forEach(function(k){
      var isActive=k===activeId;
      var isQueued=k===queuedId;
      btns[k].className='cpad-drum-btn'+(isActive?' active':'')+(isQueued?' queued':'');
    });
  });
}

function drStop(){
  DR.active=false;DR.fillQueued=false;DR.fillPlaying=false;DR.patternQueued=null;DR.lastBarRegistered=0;DR.patternBarScheduled=0;DR.barPassCount=0;
  if(DR.tickTimeout)clearTimeout(DR.tickTimeout);DR.tickTimeout=null;
  drUpdateFillBtn();
  drSetPlayStopBtn(false);
}

var DRUM_PADS=[
  {id:'kick',    label:'Kick',     icon:'💥', color:'#2a2a3a'},
  {id:'snare',   label:'Snare',    icon:'🥁', color:'#2a3028'},
  {id:'hihatc',  label:'Hi-Hat',   icon:'🎩', color:'#1e2a30'},
  {id:'hihato',  label:'Open Hat', icon:'🎩', color:'#1a2e38'},
  {id:'tomhi',   label:'Hi Tom',   icon:'🔵', color:'#28202e'},
  {id:'tomlo',   label:'Lo Tom',   icon:'🟣', color:'#241c2c'},
  {id:'crash',   label:'Crash',    icon:'⭐', color:'#2e2a1a'},
  {id:'clap',    label:'Clap',     icon:'👏', color:'#2e1e1e'},
  {id:'rim',     label:'Rim',      icon:'🪘', color:'#2e2420'},
  {id:'cowbell', label:'Cowbell',  icon:'🔔', color:'#1e2e20'},

function drPlayPad(id){
  var ac=getAC();if(ac.state==='suspended')ac.resume();
  var t=ac.currentTime+0.01;
  var v=DR.vol*PAD_VOL;
  if(id==='kick'){
    var osc=ac.createOscillator(),g=ac.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(180,t);osc.frequency.exponentialRampToValueAtTime(40,t+0.1);
    g.gain.setValueAtTime(3.5*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    osc.connect(g);g.connect(ac.destination);osc.start(t);osc.stop(t+0.25);
  } else if(id==='snare'){
    drSnare(ac,t);
  } else if(id==='hihatc'){
    drHat(ac,t,false);
  } else if(id==='hihato'){
    drHat(ac,t,true);  } else if(id==='tomhi'){
    var osc2=ac.createOscillator(),g2=ac.createGain();
    osc2.type='sine';osc2.frequency.setValueAtTime(220,t);osc2.frequency.exponentialRampToValueAtTime(100,t+0.12);
    g2.gain.setValueAtTime(2.8*v,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    osc2.connect(g2);g2.connect(ac.destination);osc2.start(t);osc2.stop(t+0.2);
  } else if(id==='tomlo'){
    var osc3=ac.createOscillator(),g3=ac.createGain();
    osc3.type='sine';osc3.frequency.setValueAtTime(140,t);osc3.frequency.exponentialRampToValueAtTime(60,t+0.15);
    g3.gain.setValueAtTime(3.0*v,t);g3.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    osc3.connect(g3);g3.connect(ac.destination);osc3.start(t);osc3.stop(t+0.25);
  } else if(id==='crash'){
    var cbuf=ac.createBuffer(1,Math.floor(ac.sampleRate*1.5),ac.sampleRate);
    var cd=cbuf.getChannelData(0);
    for(var ci2=0;ci2<cd.length;ci2++)cd[ci2]=(Math.random()*2-1);
    var cns=ac.createBufferSource();cns.buffer=cbuf;
    var chp=ac.createBiquadFilter();chp.type='highpass';chp.frequency.value=5000;
    var clp=ac.createBiquadFilter();clp.type='lowpass';clp.frequency.value=16000;
    var cg=ac.createGain();
    cg.gain.setValueAtTime(1.4*v,t);
    cg.gain.exponentialRampToValueAtTime(0.6*v,t+0.05);
    cg.gain.exponentialRampToValueAtTime(0.15*v,t+0.4);
    cg.gain.exponentialRampToValueAtTime(0.001,t+1.4);
    cns.connect(chp);chp.connect(clp);clp.connect(cg);cg.connect(ac.destination);
    cns.start(t);cns.stop(t+1.5);
  } else if(id==='clap'){
    for(var c=0;c<3;c++){
      (function(ci){
        var bt=t+ci*0.012;
        var buf2=ac.createBuffer(1,ac.sampleRate*0.05,ac.sampleRate);
        var d2=buf2.getChannelData(0);for(var j=0;j<d2.length;j++)d2[j]=(Math.random()*2-1);
        var ns2=ac.createBufferSource();ns2.buffer=buf2;
        var bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=0.7;
        var g5=ac.createGain();g5.gain.setValueAtTime(1.8*v,bt);g5.gain.exponentialRampToValueAtTime(0.001,bt+0.08);
        ns2.connect(bp);bp.connect(g5);g5.connect(ac.destination);ns2.start(bt);ns2.stop(bt+0.09);
      })(c);
    }
  } else if(id==='rim'){
    // Rimshot: short sharp click
    var ro=ac.createOscillator(),rg=ac.createGain();
    ro.type='square';ro.frequency.setValueAtTime(900,t);ro.frequency.exponentialRampToValueAtTime(400,t+0.02);
    rg.gain.setValueAtTime(2.0*v,t);rg.gain.exponentialRampToValueAtTime(0.001,t+0.04);
    ro.connect(rg);rg.connect(ac.destination);ro.start(t);ro.stop(t+0.05);
  } else if(id==='cowbell'){
    // Cowbell: classic TR-808 style — two detuned square waves, bandpass filtered, sharp attack
    var cb1=ac.createOscillator(),cb2=ac.createOscillator();
    var cbBP=ac.createBiquadFilter(),cbHP=ac.createBiquadFilter();
    var cbEnv=ac.createGain();
    cb1.type='square';cb1.frequency.setValueAtTime(562,t);
    cb2.type='square';cb2.frequency.setValueAtTime(845,t);
    cbBP.type='bandpass';cbBP.frequency.value=900;cbBP.Q.value=1.2;
    cbHP.type='highpass';cbHP.frequency.value=300;
    // Punchy envelope — fast attack, two-stage decay
    cbEnv.gain.setValueAtTime(0.001,t);
    cbEnv.gain.exponentialRampToValueAtTime(2.5*v,t+0.002);
    cbEnv.gain.exponentialRampToValueAtTime(0.3*v,t+0.05);
    cbEnv.gain.exponentialRampToValueAtTime(0.001,t+0.55);
    cb1.connect(cbBP);cb2.connect(cbBP);
    cbBP.connect(cbHP);cbHP.connect(cbEnv);cbEnv.connect(ac.destination);
    cb1.start(t);cb2.start(t);cb1.stop(t+0.6);cb2.stop(t+0.6);cb2.stop(t+0.45);
  } else if(id==='shaker'){
    // Shaker: filtered noise, short
    var sbuf=ac.createBuffer(1,ac.sampleRate*0.08,ac.sampleRate);
    var sd=sbuf.getChannelData(0);for(var si2=0;si2<sd.length;si2++)sd[si2]=(Math.random()*2-1);
    var sns=ac.createBufferSource();sns.buffer=sbuf;
    var shp=ac.createBiquadFilter();shp.type='bandpass';shp.frequency.value=8000;shp.Q.value=1.5;
    var shg=ac.createGain();shg.gain.setValueAtTime(1.2*v,t);shg.gain.exponentialRampToValueAtTime(0.001,t+0.07);
    sns.connect(shp);shp.connect(shg);shg.connect(ac.destination);sns.start(t);sns.stop(t+0.09);
  } else if(id==='ride'){
    // Ride cymbal: soft ping attack + controlled washy tail
    var rPing=ac.createOscillator(),rPingG=ac.createGain();
    rPing.type='sine';rPing.frequency.value=3800;
    rPingG.gain.setValueAtTime(0.6*v,t);
    rPingG.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    rPing.connect(rPingG);rPingG.connect(ac.destination);
    rPing.start(t);rPing.stop(t+0.09);
    // Narrow shimmer — tight bandpass, controlled decay
    var rbuf=ac.createBuffer(1,Math.floor(ac.sampleRate*1.4),ac.sampleRate);
    var rd=rbuf.getChannelData(0);
    for(var ri=0;ri<rd.length;ri++)rd[ri]=(Math.random()*2-1);
    var rns=ac.createBufferSource();rns.buffer=rbuf;
    var rbp1=ac.createBiquadFilter();rbp1.type='bandpass';rbp1.frequency.value=6000;rbp1.Q.value=4.0;
    var rbp2=ac.createBiquadFilter();rbp2.type='highpass';rbp2.frequency.value=5000;
    var rg2=ac.createGain();
    rg2.gain.setValueAtTime(0.4*v,t);
    rg2.gain.exponentialRampToValueAtTime(0.1*v,t+0.2);
    rg2.gain.exponentialRampToValueAtTime(0.001,t+1.2);
    rns.connect(rbp1);rbp1.connect(rbp2);rbp2.connect(rg2);rg2.connect(ac.destination);
    rns.start(t);rns.stop(t+1.4);
  }
}

// Release all held chord/melody pads — call before any update() that rebuilds the pad grid
function releaseAllPads(){
  Object.keys(_padPtrs).forEach(function(pid){
    var ptr=_padPtrs[pid];
    if(ptr&&ptr.padEl)try{ptr.padEl.classList.remove('pressed');}catch(e){}
    delete _padPtrs[pid];
  });
  Object.keys(_padPtrs2).forEach(function(pid){
    var ptr=_padPtrs2[pid];
    if(ptr&&ptr.padEl)try{ptr.padEl.classList.remove('pressed');}catch(e){}
    delete _padPtrs2[pid];
  });
}

function buildChordPadPage(){
  var stType=chordScaleType();
  var sem=tRow().semitone;
  var cd=CHORD_DEFS[stType]||CHORD_DEFS['Major'];
  var steps=SCALE_STEPS[stType]||SCALE_STEPS['Major'];

  // 8 chords: degrees 0-6 plus degree 0 an octave up
  var PADS=[];
  for(var di=0;di<7;di++){
    var rootPc=(sem+steps[di])%12;
    var q=(cd[di]||cd[0]).q;
    PADS.push({deg:di,label:PC[rootPc]+(TRIAD_LABEL[q]||''),numeral:(cd[di]||{n:'?'}).n,
      color:TONICS.find(function(t){return t.semitone===rootPc;})||{color:'#555'}});
  }
  // 8th pad: I an octave up
  var root8Pc=sem%12;
  PADS.push({deg:0,label:PC[root8Pc]+(TRIAD_LABEL[(cd[0]||{}).q]||'')+'\'',
    numeral:'I\'',color:TONICS.find(function(t){return t.semitone===root8Pc;})||{color:'#555'},
    octaveUp:true});
  // Pads 9-12: II through V an octave up (shown only in 12-pad mode)
  for(var di12=1;di12<=4;di12++){
    var rpc12=(sem+steps[di12])%12;
    var q12=(cd[di12]||cd[0]).q;
    PADS.push({deg:di12,label:PC[rpc12]+(TRIAD_LABEL[q12]||"")+("'"),
      numeral:(cd[di12]||{n:"?"}).n+("'"),
      color:TONICS.find(function(tt){return tt.semitone===rpc12;})||{color:"#555"},
      octaveUp:true});
  }

  // Calculate chord MIDIs exactly as the Chords page does — same voicing, same sound
  function padMidis(pad){
    var deg=pad.deg;
    var rootPc=(sem+steps[deg])%12;
    var q=(cd[deg]||cd[0]).q;
    var si=TRIAD_SEMI[q]||TRIAD_SEMI['maj'];
    // Mirror getChordMidis from chords page exactly
    var deg0root=60+sem%12;
    var prevMidi=deg0root;
    for(var d=1;d<=deg;d++){
      var nextPc=(sem+steps[d])%12;
      var nextMidi=prevMidi-prevMidi%12+nextPc;
      if(nextMidi<=prevMidi)nextMidi+=12;
      prevMidi=nextMidi;
    }
    var rootMidi=(deg===0)?deg0root:prevMidi;
    // 8th pad is I an octave up — add 12 AFTER base calculation
    var baseRoot=rootMidi;
    while(baseRoot<KS)baseRoot+=12;
    while(baseRoot+si[si.length-1]>KE)baseRoot-=12;
    if(pad.octaveUp)rootMidi=baseRoot+12;
    else rootMidi=baseRoot;
    return si.map(function(s){return rootMidi+s;});
  }

  var wrap=el('div',{cls:'cpad-wrap'});

  // Helper: build drum pattern buttons row
  function makeDrumControls(drumRef){
    var drumRow=el('div',{cls:'cpad-row',style:{flexWrap:'nowrap',gap:'3px'}});
    drumRow.appendChild(el('span',{cls:'cpad-label',style:{flexShrink:'0'}},'Drums'));
    var drumBtns={};
    [{id:'simple',l:'Simple'},{id:'disco',l:'Disco'},{id:'rock',l:'Rock'},{id:'breakdown',l:'Breakdown'}].forEach(function(d){
      var b=el('button',{cls:'cpad-drum-btn'+(DR.active&&DR.pattern===d.id?' active':''),
        style:{flex:'1',minWidth:'0',touchAction:'none'}},d.l);
      b.addEventListener('pointerdown',function(ev){
        ev.stopPropagation();
        if(DR.active&&DR.pattern===d.id&&!DR.patternQueued){
          drStop();drSetPlayStopBtn(false);
          drUpdatePatternBtns();
        } else if(DR.active){
          DR.patternQueued=d.id;
          DR.barPassCount=1;
          drUpdatePatternBtns();
        } else {
          drStart(d.id);drSetPlayStopBtn(true);
          drUpdatePatternBtns();
        }
      });
      drumBtns[d.id]=b;drumRow.appendChild(b);
    });
    // Fill button — touch-action:none so it works while holding a pad
    var fillBtn=el('button',{cls:'cpad-drum-btn'+(DR.fillQueued?' active':''),
      style:{touchAction:'none'}},'\u2935 Fill');
    fillBtn.title='Queue a drum fill at next bar';
    tapAction(fillBtn,function(){
      if(!DR.active){drStart(DR.lastPattern);drSetPlayStopBtn(true);}
      DR.fillQueued=!DR.fillQueued;drUpdateFillBtn();
    });
    drumRow.appendChild(fillBtn);
    UI.cpadFillBtnsPortrait=fillBtn;
    // Play/Stop toggle button — far right

      isPlaying?'\u23F9':'\u25B6');

      }

  // ── Pad content branch ────────────────────────────────────────────────────
  // Shared pointer tracking engine — used by ALL pad types
  _padPtrs2={}; // reset global on rebuild

  function mlPadPlay(idx,p,midi){
    haptic();
    var ac=getAC();if(ac.state==='suspended')ac.resume();
    if(CP_PAD.activeNodes[idx])CP_PAD.activeNodes[idx].forEach(function(n){
      if(n.gain){try{n.gain.gain.setValueAtTime(0,ac.currentTime);}catch(e){}}
      else{try{n.stop();}catch(e){}}
    });
    var nodes=playNoteHeld(midi,ac.currentTime+0.005,0.45*PAD_VOL);
    CP_PAD.activeNodes[idx]=nodes;
    p.classList.add('pressed');
    return nodes;
  }

  function mlPadRelease(nodes,p,idx){
    p.classList.remove('pressed');
    if(!nodes)return;
    var ac=getAC();var now=ac.currentTime;var decay=SYNTH.decay;
    nodes.forEach(function(n){
      if(!n)return;
      if(n.gain){try{n.gain.cancelScheduledValues(now);n.gain.setValueAtTime(n.gain.value,now);n.gain.exponentialRampToValueAtTime(0.001,now+decay);}catch(e){}}
      else{try{n.stop(now+decay+0.05);}catch(e){}}
    });
    CP_PAD.activeNodes[idx]=null;
  }

  function getGridPad2(x,y){
    var e=document.elementFromPoint(x,y);
    while(e&&!e.classList.contains('cpad-pad'))e=e.parentElement;
    return(e&&e._padIdx2!==undefined)?e:null;
  }

  if(DR.melodyMode){
    // 8 scale notes from ML.tonic
    var mlSem=(TONICS.find(function(r){return r.label===ML.tonic;})||TONICS[0]).semitone;
    var mlScaleType=ML.minor?'Natural Minor':'Major';
    var mlIvs=IV[mlScaleType]||IV['Major'];
    var mlMidis=[];var m=48+mlSem;while(m<48)m+=12;
    mlMidis.push(m);var cur=m;
    // Generate padCount notes — wrap into next octave for 12-pad mode
    var ivIdx=0;
    while(mlMidis.length<ML.padCount){
      cur+=mlIvs[ivIdx%mlIvs.length];
      if(ivIdx>0&&ivIdx%mlIvs.length===0)cur+=0; // octave handled by wrapping intervals
      mlMidis.push(cur);
      ivIdx++;
    }
    var noteNames2=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

    mlMidis.forEach(function(midi,idx){
      var noteName=noteNames2[midi%12];

      p.appendChild(el('div',{cls:'cpad-pad-name'},noteName+octave));
      p._padIdx2=idx;p._padMidi=midi;p._padType='melody';
      p.setAttribute('data-pad-idx2',idx);
      p.addEventListener('pointerdown',function(ev){
        ev.preventDefault();
        try{p.releasePointerCapture(ev.pointerId);}catch(e){}
        var currentMidi=p._padMidi; // read live — updated by key change
        var nodes=mlPadPlay(p._padIdx2,p,currentMidi);
        _padPtrs2[ev.pointerId]={idx:p._padIdx2,nodes:nodes,padEl:p,type:'melody'};
      });
      grid.appendChild(p);
    });

    // Grid pointermove: swipe between pads, per-pointer (supports multi-touch)
    grid.addEventListener('pointermove',function(ev){
      var ptr=_padPtrs2[ev.pointerId];if(!ptr||ptr.type!=='melody')return;
      var t=getGridPad2(ev.clientX,ev.clientY);
      if(!t||t._padIdx2===ptr.idx)return;
      mlPadRelease(ptr.nodes,ptr.padEl,ptr.idx);
      var nodes=mlPadPlay(t._padIdx2,t,t._padMidi);
      ptr.idx=t._padIdx2;ptr.nodes=nodes;ptr.padEl=t;
    });
    grid.addEventListener('pointerup',function(ev){
      var ptr=_padPtrs2[ev.pointerId];if(!ptr||ptr.type!=='melody')return;
      mlPadRelease(ptr.nodes,ptr.padEl,ptr.idx);
      delete _padPtrs2[ev.pointerId];
    });
    grid.addEventListener('pointercancel',function(ev){
      var ptr=_padPtrs2[ev.pointerId];if(!ptr||ptr.type!=='melody')return;
      mlPadRelease(ptr.nodes,ptr.padEl,ptr.idx);
      delete _padPtrs2[ev.pointerId];

  else {
  // ── Shared pad engine: swipe + per-pointer tracking ──────────────────────
  _padPtrs={}; // reset global on rebuild

  function padPlayChord(idx,p,mids){
    haptic();
    var ac=getAC();if(ac.state==='suspended')ac.resume();
    var now=ac.currentTime;
    // Play with richer waveform regardless of preset so major/minor quality is clear
    // Override wave to at least 0.3 (triangle/square blend) for chord pads

    SYNTH.wave=savedWave;
    CP_PAD.activeNodes[idx]=[{_marker:true}];
    p.classList.add('pressed');
    return CP_PAD.activeNodes[idx];
  }

  function padReleaseNodes(nodes,p){
    p.classList.remove('pressed');

  function getGridPad(x,y){
    var e=document.elementFromPoint(x,y);

      var dp=DRUM_PADS[padIdx];
      var isSel=DR.moveMode&&DR.moveSel===slotIdx;
      var p=el('button',{cls:'cpad-pad'+(isSel?' move-selected':''),style:{
        background:DR.moveMode?'rgba(30,30,40,0.95)':dp.color,

        p.appendChild(el('div',{cls:'cpad-pad-numeral',style:{fontSize:'1.4rem'}},isSel?'\uD83D\uDCCC':dp.icon));
        p.appendChild(el('div',{cls:'cpad-pad-name'},dp.label));
        p.addEventListener('pointerdown',function(ev){
          ev.preventDefault();haptic();
          if(DR.moveSel===-1){DR.moveSel=slotIdx;update();}
          else if(DR.moveSel===slotIdx){DR.moveSel=-1;update();}
          else{var tmp=DR.drumPadOrder[DR.moveSel];DR.drumPadOrder[DR.moveSel]=DR.drumPadOrder[slotIdx];DR.drumPadOrder[slotIdx]=tmp;DR.moveSel=-1;update();}
        });
      } else {
        p.appendChild(el('div',{cls:'cpad-pad-numeral',style:{fontSize:'1.4rem'}},dp.icon));
        p.appendChild(el('div',{cls:'cpad-pad-name'},dp.label));
        p._padIdx=slotIdx;p._padType='drum';p._dp=dp;
        p.addEventListener('pointerdown',function(ev){
          ev.preventDefault();
          try{p.releasePointerCapture(ev.pointerId);}catch(e){}
          haptic();p.classList.add('pressed');drPlayPad(dp.id);
          _padPtrs[ev.pointerId]={idx:slotIdx,padEl:p,type:'drum'};
        });
      }
      grid.appendChild(p);
    });
    grid.addEventListener('pointermove',function(ev){
      var ptr=_padPtrs[ev.pointerId];if(!ptr||ptr.type!=='drum')return;
      var t=getGridPad(ev.clientX,ev.clientY);
      if(!t||t._padIdx===ptr.idx)return;
      ptr.padEl.classList.remove('pressed');t.classList.add('pressed');
      haptic();drPlayPad(t._dp.id);
      ptr.idx=t._padIdx;ptr.padEl=t;
    });
    grid.addEventListener('pointerup',function(ev){var p2=_padPtrs[ev.pointerId];if(p2&&p2.type==='drum'){p2.padEl.classList.remove('pressed');delete _padPtrs[ev.pointerId];}});
    grid.addEventListener('pointercancel',function(ev){var p2=_padPtrs[ev.pointerId];if(p2&&p2.type==='drum'){p2.padEl.classList.remove('pressed');delete _padPtrs[ev.pointerId];}});

  } else {
    var padsToShow=PADS.slice(0,DR.padCount);
    padsToShow.forEach(function(pad,idx){
      var mids=padMidis(pad);
      var col=pad.color.color||'#555';
      var p=el('button',{cls:'cpad-pad',style:{background:col,boxShadow:'inset 0 -4px 0 rgba(0,0,0,0.25)'}});
      p.appendChild(el('div',{cls:'cpad-pad-numeral'},pad.numeral));
      p.appendChild(el('div',{cls:'cpad-pad-name'},pad.label));
      p._padIdx=idx;p._padMids=mids;p._padType='chord';
      p.addEventListener('pointerdown',function(ev){
        ev.preventDefault();
        try{p.releasePointerCapture(ev.pointerId);}catch(e){}
        var nodes=padPlayChord(idx,p,mids);
        _padPtrs[ev.pointerId]={idx:idx,nodes:nodes,padEl:p,type:'chord'};
      });
      grid.appendChild(p);
    });
    grid.addEventListener('pointermove',function(ev){
      var ptr=_padPtrs[ev.pointerId];if(!ptr||ptr.type!=='chord')return;
      var t=getGridPad(ev.clientX,ev.clientY);
      if(!t||t._padIdx===ptr.idx)return;
      padReleaseNodes(ptr.nodes,ptr.padEl);CP_PAD.activeNodes[ptr.idx]=null;
      var nodes=padPlayChord(t._padIdx,t,t._padMids);
      ptr.idx=t._padIdx;ptr.nodes=nodes;ptr.padEl=t;
    });
    grid.addEventListener('pointerup',function(ev){
      var ptr=_padPtrs[ev.pointerId];if(!ptr||ptr.type!=='chord')return;
      padReleaseNodes(ptr.nodes,ptr.padEl);CP_PAD.activeNodes[ptr.idx]=null;delete _padPtrs[ev.pointerId];
    });
    grid.addEventListener('pointercancel',function(ev){
      var ptr=_padPtrs[ev.pointerId];if(!ptr||ptr.type!=='chord')return;
      padReleaseNodes(ptr.nodes,ptr.padEl);CP_PAD.activeNodes[ptr.idx]=null;delete _padPtrs[ev.pointerId];
    });
  } // end else (drum/chord pad engine)
  } // end else (not melody mode)

  // Help link
  var padHelp=el('div',{style:{textAlign:'center',padding:'4px 0 2px',flexShrink:'0'}});
  var padHelpA=el('a',{style:{fontFamily:JF,fontSize:'0.52rem',letterSpacing:'0.08em',
    color:'var(--sub)',textDecoration:'none',opacity:'0.5'}},'\u24d8 Help');
  padHelpA.href='https://dataetude.co.uk/piano-scales-lab/pads';
  padHelpA.target='_blank';
  padHelp.appendChild(padHelpA);
  wrap.appendChild(padHelp);

  return wrap;
}

  return CS.chordMode||'Major';

// Called from update() every time scale/tonic changes
function refreshChordPage(){
  if(!UI.chordList||!UI.progList||!UI.chKb)return;
  var stType=chordScaleType();
  var sem=tRow().semitone;
  var cd=CHORD_DEFS[stType]||CHORD_DEFS['Major'];
  var steps=SCALE_STEPS[stType]||SCALE_STEPS['Major'];
  CS.deg=Math.min(CS.deg,cd.length-1);

  function getChordMidis(deg,inv,qOverride){
    var rootPc=(sem+steps[deg])%12;
    var q=qOverride||(cd[deg]||cd[0]).q;
    var si=TRIAD_SEMI[q]||TRIAD_SEMI['maj'];
    // Anchor the whole scale to octave 4 (MIDI 48 = C3 in our scheme).
    // Place degree 0 root at the lowest sensible point, then each subsequent
    // degree must be >= its predecessor's root, going up chromatically.
    // This ensures i→vii always ascends left-to-right on the keyboard.
    var baseOct=4; // octave for degree 0 root
    var deg0root=48+sem%12; // semitone 0 of the scale in octave 4
    // Walk up from degree 0 to find where this degree's root sits
    var prevMidi=deg0root;
    for(var d=1;d<=deg;d++){
      var nextPc=(sem+steps[d])%12;
      var nextMidi=prevMidi-prevMidi%12+nextPc; // same octave
      if(nextMidi<=prevMidi)nextMidi+=12; // must be higher
      prevMidi=nextMidi;
    }
    var rootMidi=(deg===0)?deg0root:prevMidi;
    // Keep within keyboard range
    while(rootMidi<KS)rootMidi+=12;
    while(rootMidi+si[si.length-1]>KE)rootMidi-=12;
    var mids=si.map(function(s){return rootMidi+s;});
    inv=inv||0;
    for(var i=0;i<inv;i++){mids[0]+=12;mids.sort(function(a,b){return a-b;});}
    return mids;
  }

  function showChord(deg,inv){
    var mids=getChordMidis(deg,inv);
    UI.chKb.upd(mids,[],rhHi(),rhDk());
  }

  function selectChord(deg,inv,silent){
    CS.deg=deg;CS.inv=inv||0;
    showChord(deg,CS.inv);
    if(!silent)playChordNow(getChordMidis(deg,CS.inv));
    renderChordList();
  }

  function renderChordList(){
    UI.chordList.innerHTML='';
    cd.forEach(function(c,di){
      var rootPc=(sem+steps[di])%12;
      var rootName=PC[rootPc];
      var qual=TRIAD_LABEL[c.q]||'';
      var chordName=rootName+qual;
      var si=TRIAD_SEMI[c.q]||[0,4,7];
      var rootNotes=si.map(function(s){return PC[(rootPc+s)%12];});
      var invCount=si.length;
      var invLabels=invCount===4?['Root','1st','2nd','3rd']:['Root','1st','2nd'];
      var uid=CS.chordMode+'|'+di;
      var isSel=CS.selUid===uid;
      var selInv=isSel?(CS.inv||0):0;
      var noteSets=[];
      for(var ii2=0;ii2<invCount;ii2++){
        var rotated=rootNotes.slice(ii2).concat(rootNotes.slice(0,ii2));
        noteSets.push(rotated.join(' \u2013 '));
      }
      var row=el('div',{cls:'chord-row'+(isSel?' sel':'')});
      row.appendChild(el('div',{cls:'chord-numeral',style:{color:isSel?rhDk():'#666',fontWeight:isSel?'700':'400'}},c.n));
      var nameDiv=el('div',{cls:'chord-name'});
      nameDiv.appendChild(el('div',{cls:'chord-name-main',style:{color:isSel?rhDk():''}},chordName));
      nameDiv.appendChild(el('div',{cls:'chord-notes-txt'},noteSets[selInv]));
      row.appendChild(nameDiv);
      var invDiv=el('div',{style:{display:'flex',gap:'4px',padding:'6px 8px',alignItems:'center'}});
      invLabels.forEach(function(lbl,ii){
        var isSI=isSel&&selInv===ii;
        var ib=el('button',{style:{
          padding:'5px 8px',borderRadius:'8px',fontFamily:JF,fontSize:'0.55rem',
          letterSpacing:'0.04em',border:'1px solid '+(isSI?rhDk()+'88':'var(--border)'),
          background:isSI?rhDk()+'22':'transparent',color:isSI?rhDk():'var(--sub)',
          cursor:'pointer',whiteSpace:'nowrap',minWidth:'36px',textAlign:'center'
        }},lbl);
        (function(invIdx,uidKey,diIdx,cDef){
          ib.addEventListener('click',function(e){
            e.stopPropagation();
            CS.selUid=uidKey;CS.inv=invIdx;CS.deg=diIdx;CS.q=cDef.q;
            var mids=getChordMidis(diIdx,invIdx,cDef.q);
            UI.chKb.upd(mids,[],rhHi(),rhDk());
            playChordNow(mids);
            renderChordList();
          });
        })(ii,uid,di,c);
        invDiv.appendChild(ib);
      });
      row.appendChild(invDiv);
      (function(diIdx,uidKey,cDef){
        row.addEventListener('click',function(){
          CS.selUid=uidKey;CS.inv=0;CS.deg=diIdx;CS.q=cDef.q;
          var mids=getChordMidis(diIdx,0,cDef.q);
          UI.chKb.upd(mids,[],rhHi(),rhDk());
          playChordNow(mids);
          renderChordList();
        });
      })(di,uid,c);
      UI.chordList.appendChild(row);
    });
  }

  // Expose getChordMidis for the progression player so it uses identical logic
  CP.getChordMidis=getChordMidis;

  function buildProgSeq(pg){
    // Use the exact same getChordMidis as the chord card display — same range, same logic
    return pg.steps.map(function(di){
      return getChordMidis(di,0); // always root position in progressions
    });
  }

  UI.progPlayBtns={};

  // Set up refreshProgStepUI so cpTick can update the lit chord buttons
  refreshProgStepUI=function(){
    if(!UI.progList)return;
    var rows=UI.progList.querySelectorAll('[data-pi]');
    rows.forEach(function(row){
      var pi=parseInt(row.getAttribute('data-pi'),10);
      var stepBtns=row.querySelectorAll('[data-si]');
      stepBtns.forEach(function(sb){
        var si=parseInt(sb.getAttribute('data-si'),10);
        var isLit=CP.active&&CP.progIdx===pi&&CS.progStep===si;
        sb.style.color=isLit?rhDk():'var(--sub)';
        sb.style.background=isLit?rhDk()+'22':'rgba(255,255,255,0.05)';
        sb.style.borderColor=isLit?rhDk()+'88':'rgba(255,255,255,0.12)';
      });
    });
  };

  function renderProgressions(){
    UI.progList.innerHTML='';
    UI.progPlayBtns={};
    var progs=PROGRESSIONS[stType]||PROGRESSIONS['Major'];
    progs.forEach(function(pg,pi){
      var isAct=pi===CS.progIdx;
      var row=el('div',{cls:'prog-row'+(isAct?' active':'')});
      row.setAttribute('data-pi',pi);

      // Header row: genre label + play/loop buttons
      var hdr=el('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'3px'}});
      hdr.appendChild(el('div',{cls:'prog-genre',style:{flex:'1'}},pg.genre));

      var playBtn=el('button',{cls:'prog-play-btn'},'\u25B6');
      playBtn.title='Play this progression';
      var loopBtn=el('button',{cls:'prog-loop-btn'},'\uD83D\uDD01');
      loopBtn.title='Loop';

      playBtn.addEventListener('click',function(e){
        e.stopPropagation();
        if(CP.active&&CP.progIdx===pi){cpStop();}
        else{
          CS.progIdx=pi;CS.progStep=0;
          var seq=buildProgSeq(pg);
          var pgRef=pg;
          cpPlay(pi,seq,UI.chKb,function(){return buildProgSeqFresh(pgRef);});
        }
      });
      loopBtn.addEventListener('click',function(e){
        e.stopPropagation();
        if(CP.active&&CP.progIdx===pi&&CP.loop){
          // Turn loop off — plays out to end then stops naturally
          CP.loop=false;
          cpSetUI();
        } else {
          CP.loop=true;
          if(!CP.active||CP.progIdx!==pi){
            CS.progIdx=pi;CS.progStep=0;
            var seq=buildProgSeq(pg);
            var pgRef=pg;
            cpPlay(pi,seq,UI.chKb,function(){return buildProgSeqFresh(pgRef);});
          }
          cpSetUI();
        }
      });

      UI.progPlayBtns[pi]={play:playBtn,loop:loopBtn};
      hdr.appendChild(playBtn);hdr.appendChild(loopBtn);
      row.appendChild(hdr);

      // Chord step buttons
      var stepsDiv=el('div',{cls:'prog-steps'});
      pg.steps.forEach(function(di,si){
        var rootPc=(sem+steps[di])%12;
        var numeral=(cd[di]||{n:'?'}).n;
        var qual=TRIAD_LABEL[(cd[di]||{}).q||'maj']||'';
        var isLit=CP.active&&pi===CP.progIdx&&si===CS.progStep;
        var span=el('button',{cls:'prog-step'+(isLit?' lit':''),style:{
          cursor:'pointer',border:'1px solid '+(isLit?rhDk()+'88':'rgba(255,255,255,0.12)'),
          background:isLit?rhDk()+'22':'rgba(255,255,255,0.05)',
          color:isLit?rhDk():'var(--sub)',padding:'5px 10px',borderRadius:'8px',
          fontFamily:JF,fontSize:'0.62rem',fontWeight:'700',
          display:'flex',flexDirection:'column',alignItems:'center',gap:'1px'
        }});
        span.setAttribute('data-si',si);
        span.appendChild(el('span',{style:{fontSize:'0.68rem',fontWeight:'700'}},numeral));
        span.appendChild(el('span',{style:{fontSize:'0.5rem',fontWeight:'400',opacity:'0.7'}},PC[rootPc]+qual));
        span.addEventListener('click',function(e){
          e.stopPropagation();
          CS.progIdx=pi;CS.progStep=si;
          selectChord(di,CS.inv);
          renderProgressions();
        });
        stepsDiv.appendChild(span);
      });
      row.appendChild(stepsDiv);

      // Expand/collapse on row click (not on buttons)
      row.addEventListener('click',function(){
        CS.progIdx=(CS.progIdx===pi?-1:pi);CS.progStep=-1;
        renderProgressions();
      });
      UI.progList.appendChild(row);
    });
    cpSetUI();
  }

  // Update chord keyboard title
  UI.chKb.title.textContent=sName()+' \u2014 Chords';
  // Hide progressions for Dom7 and Dim7 — they don't have meaningful diatonic progressions
  var hideProgs=CS.chordMode==='dom7'||CS.chordMode==='dim7';
  if(UI.progSection)UI.progSection.style.display=hideProgs?'none':'';
  if(hideProgs&&CP.active)cpStop();
  // Render everything fresh
  renderChordList();
  if(!hideProgs)renderProgressions();
  var initMids=getChordMidis(CS.deg,CS.inv,CS.q||null);
  UI.chKb.upd(initMids,[],rhHi(),rhDk());
}

  function stUpdateDuration(){
    var seqLen;
    if(TR.rhSeq&&TR.rhSeq.length>1){
      seqLen=TR.rhSeq.length-1;
    } else if(TR.lhSeq&&TR.lhSeq.length>1){
      seqLen=TR.lhSeq.length-1;
    } else {
      var isArp=S.scaleType==='Major Arpeggio'||S.scaleType==='Minor Arpeggio';
      var isChrom=S.scaleType==='Chromatic';
      var isPent=S.scaleType==='Major Pentatonic'||S.scaleType==='Minor Pentatonic';
      seqLen=isArp?12:isChrom?48:isPent?20:28;
    }
    var start=ST.startBpm,target=ST.targetBpm,incr=ST.increment,loops=ST.everyLoops;
    if(start>=target||incr<=0){stDurationEl.textContent='';return;}

    // Build lightweight schedule matching the real schedule builder exactly
    var FIFTHS_S=[0,7,2,9,4,11,6,1,8,3,10,5];
    var estKeys=ST.cycleMode&&ST.cycleKeys&&ST.cycleKeys.length>0
      ?ST.cycleKeys.slice().sort(function(a,b){
          var orderArr=ST.cycleOrder==='fifths'?FIFTHS_S:null;
          if(orderArr){
            var sa2=(window.TONICS.find(function(r){return r.label===a;})||{semitone:0}).semitone;
            var sb2=(window.TONICS.find(function(r){return r.label===b;})||{semitone:0}).semitone;
            return orderArr.indexOf(sa2)-orderArr.indexOf(sb2);
          }
          var sa=(window.TONICS.find(function(r){return r.label===a;})||{semitone:0}).semitone;
          var sb=(window.TONICS.find(function(r){return r.label===b;})||{semitone:0}).semitone;
          return sa-sb;})
      :null;
    var keyCount=estKeys?estKeys.length:1;

    var estSched=[];
    var lastBpmE=start;
    for(var bpmE=start;bpmE<=target;bpmE+=incr){
      lastBpmE=bpmE;
      if(estKeys){
        for(var ki=0;ki<estKeys.length;ki++){
          for(var li=0;li<loops;li++) estSched.push({bpm:bpmE,key:estKeys[ki]});
        }
      } else {
        for(var li2=0;li2<loops;li2++) estSched.push({bpm:bpmE,key:null});
      }
    }
    if(lastBpmE<target){
      if(estKeys){
        for(var ki2=0;ki2<estKeys.length;ki2++){
          for(var li3=0;li3<loops;li3++) estSched.push({bpm:target,key:estKeys[ki2]});
        }
      } else {
        for(var li4=0;li4<loops;li4++) estSched.push({bpm:target,key:null});
      }
    }

    // Same correction logic as _sessionTotalMs
    var totalMs2=estSched.reduce(function(acc,e){return acc+seqLen*(30000/e.bpm);},0);
    // Per-transition BPM rounding correction
    for(var ei0=1;ei0<estSched.length;ei0++){
      if(estSched[ei0].bpm!==estSched[ei0-1].bpm){
        totalMs2+=(30000/estSched[ei0-1].bpm)-(30000/estSched[ei0].bpm);
      }
    }
    // Math.round tick scheduling debt correction — matches _sessionTotalMs
    var roundingDebt2=estSched.reduce(function(acc,e){
      var floatStep=30000/e.bpm;
      return acc+seqLen*(floatStep-Math.round(floatStep));
    },0);
    totalMs2+=roundingDebt2;
    if(keyCount>1&&!ST.cycleSmooth){
      for(var ei=1;ei<estSched.length;ei++){
        if(estSched[ei].key&&estSched[ei].key!==estSched[ei-1].key){
          totalMs2+=30000/estSched[ei].bpm; // extra root at new key's BPM
        }
      }
    }
    if(keyCount>1&&!ST.cycleSmooth&&ST.cyclePause){
      for(var ei2=1;ei2<estSched.length;ei2++){
        if(estSched[ei2].key&&estSched[ei2].key!==estSched[ei2-1].key){
          totalMs2+=30000/estSched[ei2-1].bpm; // pause beat at outgoing BPM
        }
      }
    }

    var totalSec=Math.round(totalMs2/1000);
    var mins=Math.floor(totalSec/60);
    var secs=totalSec%60;
    stDurationEl.textContent='Estimated session: '+(mins>0?mins+'m ':'')+secs+'s';
  }

  stGoBtn.addEventListener('click',function(){

      ST._trainerWasAwake=_trainerWasAwake;
      if(ST.cycleMode&&ST.cycleKeys.length===0){
        var warnMod=el('div',{style:{position:'fixed',inset:'0',zIndex:'9999',
          background:'rgba(0,0,0,0.6)',display:'flex',alignItems:'center',

        var warnBox=el('div',{style:{background:'var(--sb-bg)',borderRadius:'14px',
          padding:'24px 20px',maxWidth:'280px',width:'80%',textAlign:'center',
          border:'1px solid rgba(255,255,255,0.1)'}});
        warnBox.appendChild(el('div',{style:{fontFamily:JF,fontSize:'1.2rem',marginBottom:'10px'}},'⚠️'));
        warnBox.appendChild(el('div',{style:{fontFamily:JF,fontSize:'0.75rem',fontWeight:'700',
          color:'var(--text)',marginBottom:'8px',letterSpacing:'0.04em'}},'Scale Cycle is enabled'));
        warnBox.appendChild(el('div',{style:{fontFamily:JF,fontSize:'0.65rem',color:'var(--sub)',
          lineHeight:'1.5',marginBottom:'16px'}},'No keys are selected. Open Scale Cycle Keys and pick at least one key to practice.'));
        var warnClose=el('button',{style:{fontFamily:JF,fontSize:'0.65rem',fontWeight:'600',
          padding:'8px 20px',borderRadius:'8px',background:'rgba(255,255,255,0.08)',
          color:'var(--text)',border:'1px solid rgba(255,255,255,0.15)',cursor:'pointer'}},'OK');
        warnClose.addEventListener('click',function(){warnMod.remove();});

        warnMod.appendChild(warnBox);
        warnMod.addEventListener('click',function(e){if(e.target===warnMod)warnMod.remove();});
        document.body.appendChild(warnMod);
        return;
      }
      ST.active=true;ST.goalReached=false;ST.goalLoopCount=0;

      // Sort cycle keys chromatically
      // Fifths order by semitone: C G D A E B F# C# G# D# A# F
      var FIFTHS_SEMITONES=[0,7,2,9,4,11,6,1,8,3,10,5];
      var sortedKeys=ST.cycleMode&&ST.cycleKeys.length>0
        ?ST.cycleKeys.slice().sort(function(a,b){
            var orderArr=ST.cycleOrder==='fifths'?FIFTHS_SEMITONES:null;
            if(orderArr){
              var sa=(TONICS.find(function(r){return r.label===a;})||{semitone:0}).semitone;
              var sb=(TONICS.find(function(r){return r.label===b;})||{semitone:0}).semitone;
              return orderArr.indexOf(sa)-orderArr.indexOf(sb);
            }
            var sa2=(TONICS.find(function(r){return r.label===a;})||{semitone:0}).semitone;
            var sb2=(TONICS.find(function(r){return r.label===b;})||{semitone:0}).semitone;
            return sa2-sb2;})
        :null;
      ST._sortedCycleKeys=sortedKeys;

      // Build schedule: [{bpm,key}] for every individual loop
      var sched=[];
      var lastBpm=ST.startBpm;
      for(var sb2=ST.startBpm;sb2<=ST.targetBpm;sb2+=ST.increment){
        lastBpm=sb2;
        if(sortedKeys){
          for(var ki=0;ki<sortedKeys.length;ki++){
            for(var li=0;li<ST.everyLoops;li++){
              sched.push({bpm:sb2,key:sortedKeys[ki]});
            }
          }
        } else {
          for(var li2=0;li2<ST.everyLoops;li2++){
            sched.push({bpm:sb2,key:null});
          }
        }
      }
      // If target BPM wasn't hit exactly, add a final step at target
      if(lastBpm<ST.targetBpm){
        if(sortedKeys){
          for(var ki2=0;ki2<sortedKeys.length;ki2++){
            for(var li3=0;li3<ST.everyLoops;li3++){
              sched.push({bpm:ST.targetBpm,key:sortedKeys[ki2]});
            }
          }
        } else {
          for(var li4=0;li4<ST.everyLoops;li4++){
            sched.push({bpm:ST.targetBpm,key:null});
          }
        }
      }
      ST._schedule=sched;
      ST._schedIdx=0; // current position in schedule

      // Calculate exact total session ms
      var isArpST=S.scaleType==='Major Arpeggio'||S.scaleType==='Minor Arpeggio';

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function jump(ns){
  if(!ns)return;
  var sp=ns.indexOf(' ');if(sp<0)return;
  var tonic=ns.slice(0,sp),rest=ns.slice(sp+1);
  var r=TONICS.find(function(x){return x.label===tonic||x.label.split('/')[0]===tonic;});
  if(r)S.tonic=r.label;
  var t=STYPES.slice().sort(function(a,b){return b.length-a.length;}).find(function(x){return rest.indexOf(x)>=0;});
  if(t)S.scaleType=t;
  update();
}

// ── UPDATE ────────────────────────────────────────────────────────────────────
function update(){
  trStop();
  cpStop(); // chord progression playback invalid after scale change
  persist();
  var row=tRow(),sem=row.semitone,color=row.color,name=sName();
  var ekey=fkey(S.tonic,S.scaleType,S.melodicDir);
  if(ekey)loadEditorScale(ekey,false);
  var lm=midis(sem,S.scaleType,S.melodicDir,LS,LE);
  var rm=midis(sem,S.scaleType,S.melodicDir,RS,RE);
  var f=gf(S.tonic,S.scaleType,S.melodicDir);
  var lf=f?f.lh:[],rf=f?f.rh:[];
  var rel=relScale(sem,S.scaleType),par=parScale(S.tonic,S.scaleType);

  if(UI.title){UI.title.textContent=name;UI.title.style.color=color;}
  if(UI.notes){
    UI.notes.innerHTML='';
    // Use correct enharmonic spelling (same logic as Info page Notes row).
    // Isolated entirely to this display element — no other functionality affected.
    var _LSEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
    var _LETS=['C','D','E','F','G','A','B'];
    var _TROOTS_MAJ={0:{l:'C',a:''},1:{l:'D',a:FL},2:{l:'D',a:''},3:{l:'E',a:FL},4:{l:'E',a:''},5:{l:'F',a:''},6:{l:'F',a:SH},7:{l:'G',a:''},8:{l:'A',a:FL},9:{l:'A',a:''},10:{l:'B',a:FL},11:{l:'B',a:''}};
    var _TROOTS_MIN={0:{l:'C',a:''},1:{l:'C',a:SH},2:{l:'D',a:''},3:{l:'D',a:SH},4:{l:'E',a:''},5:{l:'F',a:''},6:{l:'F',a:SH},7:{l:'G',a:''},8:{l:'G',a:SH},9:{l:'A',a:''},10:{l:'A',a:SH},11:{l:'B',a:''}};
    var _isMin=S.scaleType.indexOf('Minor')>=0||S.scaleType.indexOf('Arpeggio')>=0;
    var _re=(_isMin?_TROOTS_MIN:_TROOTS_MAJ)[sem];
    var _ivk=S.scaleType==='Melodic Minor'?(S.melodicDir==='ASC'?'Melodic Minor Asc':'Melodic Minor Desc'):S.scaleType;
    var _iv=IV[_ivk]||IV['Major'];
    var _spelled=[];
    if(_re){
      var _ri=_LETS.indexOf(_re.l);
      _spelled.push(_re.l+_re.a);
      var _cs=sem;
      for(var _i=0;_i<_iv.length-1;_i++){
        _cs=(_cs+_iv[_i])%12;
        var _nl=_LETS[(_ri+_i+1)%7];
        var _d=(_cs-_LSEMI[_nl]+12)%12;
        _spelled.push(_nl+(_d===0?'':_d===1?SH:_d===11?FL:_d===2?SH+SH:_d===10?FL+FL:''));
      }
    } else {
      // Fallback to PC names if root not found
      lm.slice(0,8).forEach(function(m){var n=PC[pcOf(m)];if(!_spelled.length||n!==_spelled[_spelled.length-1])_spelled.push(n);});
    }
    _spelled.slice(0,7).forEach(function(n,i){
      UI.notes.appendChild(el('span',{style:{fontSize:'0.6rem',fontFamily:JF,color:(i===0?color:'#555'),fontWeight:(i===0?'700':'400')}},n));
    });
  }
  if(UI.scaleTypeLabel)UI.scaleTypeLabel.textContent=S.tab==='chords'?'Chord Type':'Scale Type';
  var CHORD_STYPES=['Major','Natural Minor'];
  if(UI.typeBtns)STYPES.forEach(function(t){
    var b=UI.typeBtns[t],a=S.scaleType===t;
    // On chords tab hide all scale type buttons — chord mode buttons take over
    b.style.display=S.tab==='chords'?'none':'';
    b.style.background=a?color:'rgba(255,255,255,0.05)';b.style.color=a?'#fff':'#666';
    b.style.border=a?'none':'1px solid rgba(255,255,255,0.08)';b.style.fontWeight=a?'700':'400';
    b.style.boxShadow=a?'0 2px 10px '+color+'55':'none';
  });
  // On chords tab show chord mode buttons in the same pill row
  if(UI.chordModeBtns){
    CHORD_MODES.forEach(function(m){
      var b=UI.chordModeBtns[m.id];if(!b)return;
      var a=CS.chordMode===m.id;
      b.style.display=S.tab==='chords'?'':'none';
      b.style.background=a?color:'rgba(255,255,255,0.05)';
      b.style.color=a?'#fff':'#666';
      b.style.border=a?'none':'1px solid rgba(255,255,255,0.08)';
      b.style.fontWeight=a?'700':'400';
      b.style.boxShadow=a?'0 2px 10px '+color+'55':'none';
    });
  }
  if(UI.melWrap){
    UI.melWrap.style.display=S.scaleType==='Melodic Minor'?'flex':'none';
    ['ASC','DESC'].forEach(function(d){
      var b=UI.melBtns[d],on=S.melodicDir===d,asc=d==='ASC';
      b.style.background=on?(asc?'rgba(100,200,130,.18)':'rgba(200,100,100,.18)'):'rgba(255,255,255,0.04)';
      b.style.color=on?(asc?'#70d898':'#d87070'):'#555';
      b.style.border=on?'1px solid '+(asc?'rgba(100,200,130,.4)':'rgba(200,100,100,.4)'):'1px solid rgba(255,255,255,0.08)';
    });
  }
  if(UI.tonicBtns)TONICS.forEach(function(r){
    var b=UI.tonicBtns[r.label],a=S.tonic===r.label;
    b.style.background=a?r.color:'rgba(255,255,255,0.04)';b.style.color=a?'#fff':'#777';
    b.style.border=a?'none':'1px solid rgba(255,255,255,0.07)';b.style.fontWeight=a?'700':'400';
    b.style.boxShadow=a?'0 3px 12px '+r.color+'55':'none';
  });
  var _noRelPar=S.scaleType==='Chromatic';
  if(UI.relTxt){UI.relTxt.textContent=_noRelPar?'\u2014':(rel||'\u2014');UI.relBtn._v=_noRelPar?'':rel;}
  if(UI.parTxt){UI.parTxt.textContent=_noRelPar?'\u2014':par;UI.parBtn._v=_noRelPar?'':par;}
  _updateWakeBtn(); // keep wake lock button state consistent across all tabs

  var validTabs=['scales','chords','info','editor','metro','pads'];
  if(validTabs.indexOf(S.tab)<0)S.tab='scales';
  var shellEl=document.getElementById('shell');
  var mainEl=document.getElementById('main');
  if(mainEl)mainEl.classList.toggle('metro-tab',S.tab==='metro');
  if(mainEl)mainEl.classList.toggle('pads-tab',S.tab==='pads');
  if(mainEl)mainEl.classList.toggle('editor-tab',S.tab==='editor');
  var isMetro=S.tab==='metro';
  var isPads=S.tab==='pads';
  if(UI.title)UI.title.style.visibility=(isMetro||isPads)?'hidden':'visible';
  if(UI.notes)UI.notes.style.visibility=(isMetro||isPads)?'hidden':'visible';
  if(UI.metroTitle){
    UI.metroTitle.style.visibility=(isMetro||isPads)?'visible':'hidden';
    UI.metroTitle.textContent=isPads?'Chord Pads':'Metronome';
  }
  if(UI.placeMetroControls)UI.placeMetroControls();
  if(S.tab!=='metro'&&!MT.persist)mtStop();
  updatePortraitChordsClass();
  if(UI.tabBtns)Object.keys(UI.tabBtns).forEach(function(id){
    var btns=UI.tabBtns[id],on=S.tab===id;
    (Array.isArray(btns)?btns:[btns]).forEach(function(b){
      if(!b)return;
      b.style.color=on?color:'#555';
      b.style.borderBottom=on?'2px solid '+color:'2px solid transparent';
      b.style.fontWeight=on?'700':'400';
    });
  });
  if(UI.kP)UI.kP.style.display=S.tab==='scales'?'block':'none';
  if(UI.cP)UI.cP.style.display=S.tab==='chords'?'flex':'none';
  if(UI.iP)UI.iP.style.display=S.tab==='info'?'block':'none';
  if(UI.eP)UI.eP.style.display=S.tab==='editor'?'block':'none';
  if(UI.mP)UI.mP.style.display=S.tab==='metro'?'block':'none';
  if(UI.ppP){
    UI.ppP.style.display=S.tab==='pads'?'flex':'none';
    if(S.tab==='pads'){UI.ppP.innerHTML='';UI.ppP.appendChild(buildChordPadPage());}
  }
  if(S.tab!=='pads'){drStop();mlStop(true);}
  // Pads tab: hide scale content in ALL orientations
  if(UI.sbScaleContent)UI.sbScaleContent.style.display=(isMetro||isPads)?'none':'';
  if(UI.placeScaleContent)UI.placeScaleContent();
  // In landscape on pads: inject sidebar controls into sidebar
  var sbEl2=document.getElementById('sidebar');
  if(sbEl2){
    // Remove any existing cpad sidebar
    sbEl2.querySelectorAll('.cpad-sidebar').forEach(function(e){e.remove();});
    if(S.tab==='pads'&&UI.cpadSidebar){
      UI.cpadSidebar.style.display='flex';
      UI.cpadSidebar.style.flexDirection='column';
      sbEl2.appendChild(UI.cpadSidebar);
    }
  }

  // Keyboard highlighting
  if(UI.lhKb){
    UI.lhKb.upd(lm,lf,lhHi(),lhDk());
    UI.lhKb.title.textContent='LEFT HAND \u2014 '+name;
  }
  if(UI.rhKb){
    UI.rhKb.upd(rm,rf,rhHi(),rhDk());
    UI.rhKb.title.textContent='RIGHT HAND \u2014 '+name;
  }

  if(UI.gridBtns)TONICS.forEach(function(r){
    STYPES.forEach(function(t){
      var btns=UI.gridBtns[r.label+'|'+t],a=S.tonic===r.label&&S.scaleType===t;
      if(btns)btns.forEach(function(b){
        b.style.background=a?r.color:'rgba(255,255,255,0.04)';b.style.color=a?'#fff':'#555';
        b.style.border=a?'none':'1px solid rgba(255,255,255,0.06)';b.style.fontWeight=a?'700':'400';
        b.style.boxShadow=a?'0 1px 6px '+r.color+'55':'none';
      });
    });
  });

  var DESCS2={
    'Major':              'W-W-H-W-W-W-H. Bright and uplifting.',
    'Natural Minor':      'W-H-W-W-H-W-W. Darker and melancholic.',
    'Harmonic Minor':     'W-H-W-W-H-A-H. Exotic sound via raised 7th.',
    'Melodic Minor':      'Ascending: W-H-W-W-W-W-H — raised 6th and 7th eliminate a large interval gap, making the melody flow more naturally. Descending: W-H-W-W-H-W-W — reverts to natural minor, as this is not needed coming back down.',
    'Major Arpeggio':     'Root, major 3rd, perfect 5th across two octaves.',
    'Minor Arpeggio':     'Root, minor 3rd, perfect 5th across two octaves.',
    'Major Pentatonic':   'W-W-A-W-A. Major scale with 4th and 7th removed. Bright and versatile.',
    'Minor Pentatonic':   'A-W-W-A-W. Natural minor with 2nd and 6th removed.',
    'Chromatic':          'All 12 semitones. Every note one semitone apart.'
  };
  if(UI.abtTxt)UI.abtTxt.textContent=DESCS2[S.scaleType]||'';
  if(UI.facts){
    // ── Enharmonic note spelling for Info page Notes row ──────────────────────
    // Each scale degree must use a different letter (correct music theory spelling).
    // This function is ONLY used for the Info page display — nothing else is affected.
    var LETTER_SEMI2={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
    var LETTERS2=['C','D','E','F','G','A','B'];
    // For each tonic semitone, choose whether to spell from a sharp or flat root.
    // Flat roots: D♭(1), E♭(3), A♭(8), B♭(10) and their enharmonic equivalents.
    var TONIC_ROOTS={
      0:{l:'C',a:''},  1:{l:'D',a:FL}, 2:{l:'D',a:''},  3:{l:'E',a:FL},
      4:{l:'E',a:''},  5:{l:'F',a:''},  6:{l:'F',a:SH},  7:{l:'G',a:''},
      8:{l:'A',a:FL},  9:{l:'A',a:''},  10:{l:'B',a:FL}, 11:{l:'B',a:''}
    };
    // For F# major use F# root, for Gb use Gb — app tonic labels help us choose:
    // The TONICS semitone 6 tonic label is F♯/G♭ — we use F♯ spelling (sharps key)
    // Semitone 1 label is C♯/D♭ — we use D♭ spelling (flats key) for minor but
    // C♯ is used in the app for C♯ minor contexts. Use flat for major (Db major),
    // sharp for minor (C# minor). Determine from scale type:
    var TONIC_ROOTS_MINOR={
      0:{l:'C',a:''},  1:{l:'C',a:SH}, 2:{l:'D',a:''},  3:{l:'D',a:SH},
      4:{l:'E',a:''},  5:{l:'F',a:''},  6:{l:'F',a:SH},  7:{l:'G',a:''},
      8:{l:'G',a:SH},  9:{l:'A',a:''},  10:{l:'A',a:SH}, 11:{l:'B',a:''}
    };
    var isMinorType=S.scaleType.indexOf('Minor')>=0||S.scaleType.indexOf('Arpeggio')>=0;
    var rootEntry=(isMinorType?TONIC_ROOTS_MINOR:TONIC_ROOTS)[sem];
    function spellScaleNotes(rootEntry,intervals){
      var rootLetter=rootEntry.l,rootAcc=rootEntry.a;
      var rootIdx=LETTERS2.indexOf(rootLetter);
      var result=[rootLetter+rootAcc];
      var currentSemi=sem;
      for(var ii=0;ii<intervals.length-1;ii++){
        currentSemi=(currentSemi+intervals[ii])%12;
        var nextIdx=(rootIdx+ii+1)%7;
        var nextLetter=LETTERS2[nextIdx];
        var naturalSemi=LETTER_SEMI2[nextLetter];
        var diff=(currentSemi-naturalSemi+12)%12;
        var name;
        if(diff===0)name=nextLetter;
        else if(diff===1)name=nextLetter+SH;
        else if(diff===11)name=nextLetter+FL;
        else if(diff===2)name=nextLetter+SH+SH; // double sharp (rare)
        else if(diff===10)name=nextLetter+FL+FL; // double flat (rare)
        else name=nextLetter; // fallback
        result.push(name);
      }
      return result;
    }
    var ivKey2=S.scaleType;
    if(S.scaleType==='Melodic Minor')ivKey2=S.melodicDir==='ASC'?'Melodic Minor Asc':'Melodic Minor Desc';
    var ivArr2=IV[ivKey2]||IV['Major'];
    var spelledNotes;
    if(S.scaleType==='Chromatic'){
      var CHROM_NAMES=['C','C'+SH,'D','D'+SH,'E','F','F'+SH,'G','G'+SH,'A','A'+SH,'B'];
      spelledNotes=[];
      for(var ci=0;ci<12;ci++)spelledNotes.push(CHROM_NAMES[(sem+ci)%12]);
    } else if(S.scaleType==='Major Pentatonic'||S.scaleType==='Minor Pentatonic'){
      // Use simple PC names — pentatonic skips degrees so diatonic spelling breaks
      var PENT_NAMES_SH=['C','C'+SH,'D','D'+SH,'E','F','F'+SH,'G','G'+SH,'A','A'+SH,'B'];
      var PENT_NAMES_FL=['C','D'+FL,'D','E'+FL,'E','F','G'+FL,'G','A'+FL,'A','B'+FL,'B'];
      // Use flat names for flat-side keys
      var useFlatPent=(sem===1||sem===3||sem===5||sem===8||sem===10);
      var pNames=useFlatPent?PENT_NAMES_FL:PENT_NAMES_SH;
      spelledNotes=[];
      var pSem=sem;
      spelledNotes.push(pNames[pSem%12]);
      for(var pi=0;pi<ivArr2.length;pi++){
        pSem+=ivArr2[pi];
        spelledNotes.push(pNames[pSem%12]);
      }
    } else {
      spelledNotes=rootEntry?spellScaleNotes(rootEntry,ivArr2):[];
    }
    UI.facts['Notes'].textContent=spelledNotes.join(' ');
    // Interval name map
    var INAMES={1:'S',2:'T',3:'A2',4:'M3',5:'P4'};
    function intervalName(st){return INAMES[st]||st+'st';}
    var ivKey=S.scaleType;
    if(S.scaleType==='Melodic Minor')ivKey=S.melodicDir==='ASC'?'Melodic Minor Asc':'Melodic Minor Desc';
    var ivArr=IV[ivKey]||IV['Major'];
    UI.facts['Intervals'].textContent=ivArr.map(intervalName).join(' \u2013 ');
    UI.facts['Root'].textContent=PC[pcOf(lm[0])];
    UI.facts['Type'].textContent=S.scaleType;
    // Key signature — based on major key (relative minor shares the same)
    var KEY_SIG={
      0:'C \u2014 no sharps or flats',
      7:'G \u2014 1 sharp (F\u266f)',
      2:'D \u2014 2 sharps (F\u266f C\u266f)',
      9:'A \u2014 3 sharps (F\u266f C\u266f G\u266f)',
      4:'E \u2014 4 sharps (F\u266f C\u266f G\u266f D\u266f)',
      11:'B \u2014 5 sharps (F\u266f C\u266f G\u266f D\u266f A\u266f)',
      1:'D\u266d \u2014 5 flats (B\u266d E\u266d A\u266d D\u266d G\u266d)',
      8:'A\u266d \u2014 4 flats (B\u266d E\u266d A\u266d D\u266d)',
      3:'E\u266d \u2014 3 flats (B\u266d E\u266d A\u266d)',
      10:'B\u266d \u2014 2 flats (B\u266d E\u266d)',
      5:'F \u2014 1 flat (B\u266d)'
    };
    // Semitone 6 depends on sharp vs flat side
    var KEY_SIG_6_SHARP='F\u266f \u2014 6 sharps (F\u266f C\u266f G\u266f D\u266f A\u266f E\u266f)';
    var KEY_SIG_6_FLAT='G\u266d \u2014 6 flats (B\u266d E\u266d A\u266d D\u266d G\u266d C\u266d)';
    // Sharp side tonics at semitone 6 context: F#, C#, G#, D#, A#
    var sharpSideLabels=['F\u266f','C\u266f','G\u266f','D\u266f','A\u266f','F\u266f/G\u266d'];
    var majorSem=sem;
    if(S.scaleType.indexOf('Minor')>=0){
      majorSem=(sem+3)%12;
    }
    var keySigText;
    if(majorSem===6){
      keySigText='F\u266f / G\u266d \u2014 6 sharps or 6 flats';
    } else {
      keySigText=KEY_SIG[majorSem]||'';
    }
    UI.facts['Key Sig'].textContent=keySigText;
    // Draw key signature staff
    var isFlat6=S.tonic.indexOf('G')>=0&&S.tonic.indexOf('\u266d')>=0;
    var isChromatic=S.scaleType==='Chromatic';
    if(UI.keySigBox)UI.keySigBox.style.display='';
    if(isChromatic){
      if(UI.keySigSubtitle)UI.keySigSubtitle.textContent='Not applicable';
      if(UI.keySigStaff)UI.keySigStaff.innerHTML='<div style="font-size:0.78rem;color:var(--sub);line-height:1.6;padding:4px 0">The chromatic scale uses all 12 notes, so no key signature applies.</div>';
    } else {
      buildKeySigStaff(majorSem,isFlat6);
    }
    UI.facts['Relative'].textContent=rel||'\u2014';
    UI.facts['Parallel'].textContent=par;
    UI.facts['LH range'].textContent=PC[pcOf(lm[0])]+ocOf(lm[0])+' \u2013 '+PC[pcOf(lm[lm.length-1])]+ocOf(lm[lm.length-1]);
    UI.facts['RH range'].textContent=PC[pcOf(rm[0])]+ocOf(rm[0])+' \u2013 '+PC[pcOf(rm[rm.length-1])]+ocOf(rm[rm.length-1]);
  }

  // BPM controls sync
  if(UI.bpmSlider){UI.bpmSlider.value=SETTINGS.tempo;UI.bpmVal.textContent=SETTINGS.tempo+' BPM';}
  setTransportUI();
  // Refresh chord page whenever scale/tonic changes
  refreshChordPage();
}

// ── KEY SIGNATURE STAFF ───────────────────────────────────────────────────────
function buildKeySigStaff(majorSem,isFlat6){
  if(!UI.keySigStaff)return;
  var svgNS='http://www.w3.org/2000/svg';
  var SHARP_STEP={F:8,C:5,G:9,D:6,A:3,E:7,B:4};
  var FLAT_STEP={B:4,E:7,A:3,D:6,G:2,C:5,F:1};
  var SHARP_ORDER=['F','C','G','D','A','E','B'];
  var FLAT_ORDER=['B','E','A','D','G','C','F'];
  var KEY_MAP={
    0:{type:null,count:0},
    7:{type:'sharp',count:1},
    2:{type:'sharp',count:2},
    9:{type:'sharp',count:3},
    4:{type:'sharp',count:4},
    11:{type:'sharp',count:5},
    6:{type:'sharp',count:6},
    1:{type:'flat',count:5},
    8:{type:'flat',count:4},
    3:{type:'flat',count:3},
    10:{type:'flat',count:2},
    5:{type:'flat',count:1}
  };
  var k=KEY_MAP[majorSem]||{type:null,count:0};
  if(majorSem===6&&isFlat6){k={type:'flat',count:6};}
  // Update subtitle text above the staff
  var countTxt=k.count===0?'No sharps or flats':k.count+(k.type==='sharp'?' sharp':' flat')+(k.count>1?'s':'');
  if(UI.keySigSubtitle)UI.keySigSubtitle.textContent=countTxt;
  // Larger viewBox with padding top and bottom to prevent clipping
  var HALF=8,BOTTOM_Y=88,STAFF_LEFT=10,STAFF_RIGHT=220,CLEF_X=22,ACC_START_X=70,ACC_STEP_X=15;
  function yOf(step){return BOTTOM_Y-step*HALF;}
  var svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 240 100');
  svg.setAttribute('style','width:100%;height:auto;display:block;');
  // Staff lines
  [0,2,4,6,8].forEach(function(step){
    var line=document.createElementNS(svgNS,'line');
    line.setAttribute('x1',STAFF_LEFT);line.setAttribute('x2',STAFF_RIGHT);
    line.setAttribute('y1',yOf(step));line.setAttribute('y2',yOf(step));
    line.setAttribute('stroke','rgba(200,200,200,0.5)');line.setAttribute('stroke-width','1.2');
    svg.appendChild(line);
  });
  // Treble clef
  var clef=document.createElementNS(svgNS,'text');
  clef.setAttribute('x',CLEF_X);clef.setAttribute('y',yOf(4)+18);
  clef.setAttribute('font-size','48');clef.setAttribute('fill','var(--text)');
  clef.textContent='\u{1D11E}';
  svg.appendChild(clef);
  // Accidentals
  var order=k.type==='sharp'?SHARP_ORDER:k.type==='flat'?FLAT_ORDER:[];
  var stepMap=k.type==='sharp'?SHARP_STEP:FLAT_STEP;
  var glyph=k.type==='sharp'?'\u266f':'\u266d';
  for(var i=0;i<k.count;i++){
    var letter=order[i];
    var step=stepMap[letter];
    var x=ACC_START_X+i*ACC_STEP_X;
    var acc=document.createElementNS(svgNS,'text');
    acc.setAttribute('x',x);
    acc.setAttribute('text-anchor','middle');
    acc.setAttribute('fill','var(--text)');
    if(k.type==='flat'){
      acc.setAttribute('y',yOf(step)+5);
      acc.setAttribute('font-size','22');
    } else {
      acc.setAttribute('y',yOf(step));
      acc.setAttribute('dominant-baseline','middle');
      acc.setAttribute('font-size','20');
    }
    acc.textContent=glyph;
    svg.appendChild(acc);
  }
  UI.keySigStaff.innerHTML='';
  UI.keySigStaff.appendChild(svg);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
IDB.load(function(saved){
  var fingValid=!!(saved&&saved.fver===FING_VERSION&&saved.FING);
  if(saved){
    if(saved.S){
      var s=saved.S;
      if(s.tonic&&TONICS.find(function(r){return r.label===s.tonic;}))S.tonic=s.tonic;
      if(s.scaleType&&STYPES.indexOf(s.scaleType)>=0)S.scaleType=s.scaleType;
      if(s.melodicDir==='ASC'||s.melodicDir==='DESC')S.melodicDir=s.melodicDir;
      if(s.tab&&['scales','chords','info','editor','metro','pads'].indexOf(s.tab)>=0)S.tab=s.tab;
    }
    if(saved.synth){
      var sy=saved.synth;
      ['wave','detune','modulation','vibratoRate','attack','decay','stereoWidth'].forEach(function(k){
        if(typeof sy[k]==='number'&&isFinite(sy[k]))SYNTH[k]=sy[k];
      });
    }
    if(saved.settings){
      var sv=saved.settings;
      if(sv.theme==='dark'||sv.theme==='light'||sv.theme==='midnight'||sv.theme==='hc')SETTINGS.theme=sv.theme;
      if(typeof sv.palette==='number'&&sv.palette>=0&&sv.palette<PALETTES.length)SETTINGS.palette=sv.palette;
      if(sv.tempo&&sv.tempo>=40&&sv.tempo<=300)SETTINGS.tempo=sv.tempo;
      if(typeof sv.haptic==='boolean')SETTINGS.haptic=sv.haptic;
      if(typeof sv.playOnLock==='boolean')SETTINGS.playOnLock=sv.playOnLock;
      if(typeof sv.trainerWakeLock==='boolean')SETTINGS.trainerWakeLock=sv.trainerWakeLock;
      if(typeof sv.defaultMetroSound==='string')SETTINGS.defaultMetroSound=sv.defaultMetroSound;
      if(sv.defaultKey&&TONICS.find(function(r){return r.label===sv.defaultKey;}))SETTINGS.defaultKey=sv.defaultKey;
      if(sv.defaultScaleType&&STYPES.indexOf(sv.defaultScaleType)>=0)SETTINGS.defaultScaleType=sv.defaultScaleType;
      if(sv.defaultPad&&['chord','drum','melody'].indexOf(sv.defaultPad)>=0)SETTINGS.defaultPad=sv.defaultPad;
      if(typeof sv.showNoteNames==='boolean')SETTINGS.showNoteNames=sv.showNoteNames;
      if(sv.defaultPadCount===8||sv.defaultPadCount===12)SETTINGS.defaultPadCount=sv.defaultPadCount;
      if(typeof sv.darkKeys==='boolean')SETTINGS.darkKeys=sv.darkKeys;
      if(typeof sv.btDelay==='number')SETTINGS.btDelay=sv.btDelay;
    }
    if(fingValid)FING=saved.FING;
  }
  if(!fingValid){FING=JSON.parse(JSON.stringify(DEF));persist();}
  // Apply defaults from SETTINGS only when no saved session state exists
  if(!saved||!saved.S){
    if(SETTINGS.defaultKey&&TONICS.find(function(r){return r.label===SETTINGS.defaultKey;}))
      S.tonic=SETTINGS.defaultKey;
    if(SETTINGS.defaultScaleType&&STYPES.indexOf(SETTINGS.defaultScaleType)>=0)
      S.scaleType=SETTINGS.defaultScaleType;
  }
  if(SETTINGS.defaultPad==="chord"){DR.melodyMode=false;DR.drumPadMode=false;}
  else if(SETTINGS.defaultPad==="drum"){DR.melodyMode=false;DR.drumPadMode=true;}
  else{DR.melodyMode=true;DR.drumPadMode=false;}
  ML.padCount=SETTINGS.defaultPadCount||8;
  DR.padCount=SETTINGS.defaultPadCount||8;
  // Apply any saved modulation level (reverb) once audio context exists on first interaction
  // _applyReverbLevel is called on first playNote via getAC building the chain
  buildUI();
  // Pre-populate fingering editor keyboards without switching to editor tab
  var _ekey=fkey(S.tonic,S.scaleType,S.melodicDir);
  if(_ekey){var _savedTab=S.tab;loadEditorScale(_ekey,true);S.tab=_savedTab;}
});
